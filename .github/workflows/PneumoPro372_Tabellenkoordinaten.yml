name: PneumoPro 3.7.2 - Tabellenkoordinaten reparieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro372_Tabellenkoordinaten.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-372-tabellenkoordinaten
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Bestehende App aus GitHub laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gesicherte OCR-Tabellenkoordinaten installieren
        shell: bash
        run: |
          if grep -q '"version": "3.7.2"' version.json; then
            echo 'PneumoPro 3.7.2 ist bereits installiert.'
          else
            python3 - <<'PY372_INSTALL'
          from pathlib import Path
          import base64, json, subprocess

          def replace_one(path, old, new, title):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1:
                  raise RuntimeError(f'{title} in {path}: {n} Fundstellen (erwartet: 1). Keine Aenderung an dieser Datei.')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          def replace_version(path):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if '3.7.1' not in s:raise RuntimeError(f'{path}: Ausgangsversion 3.7.1 fehlt.')
              p.write_text(s.replace('3.7.1','3.7.2'),encoding='utf-8')

          ver=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if ver.get('version')!='3.7.1':raise RuntimeError('PneumoPro 3.7.1 als Ausgangsversion erwartet; bestehende Dateien bleiben unveraendert.')
          if Path('lungfocus372.js').exists():raise RuntimeError('lungfocus372.js bereits vorhanden. Update-Status pruefen.')

          # Preserve original images and clinical data. Only program files change.
          Path('lungfocus372.js').write_bytes(base64.b64decode(''))

          p='lungimport365.js'
          replace_one(p,"ocrRows366='',ocrPosition367='',ocrFullTSV371='',ocrFullScale371={x:1,y:1};","ocrRows366='',ocrPosition367='',ocrFullTSV371='',ocrFullScale371={x:1,y:1},ocrRegions372=[];",'Zustand')
          replace_one(p,"ocrRows366='';ocrPosition367='';ocrFullTSV371='';ocrFullScale371={x:1,y:1};","ocrRows366='';ocrPosition367='';ocrFullTSV371='';ocrFullScale371={x:1,y:1};ocrRegions372=[];",'Neuer OCR-Durchgang')
          replace_one(p,"   if(best.score<2){\n     const regions=[","   if(best.score<10){\n     const regions=[",'Fokus auch bei teilweise lesbarer Tabelle')
          replace_one(p,"         if(best.score>=8)break;","         if(best.score>=10)break;",'Fokusgrenze')
          replace_one(p,"           const candidate=resultOf((await w.recognize(tile,{}, {tsv:true})).data);\n           if(candidate.score>best.score){best=candidate;cropName=region.name;}",
          "           const candidate=resultOf((await w.recognize(tile,{}, {tsv:true})).data);\n           if(candidate.tsv&&ocrRegions372.length<5)ocrRegions372.push({name:region.name,tsv:candidate.tsv,x:sx,y:sy,sw,sh,cw:tile.width,ch:tile.height});\n           if(candidate.score>best.score){best=candidate;cropName=region.name;}", 'TSV-Wortkoordinaten jedes Tabellenausschnitts speichern')
          replace_one(p,"if(isPdf){ocrRows366='';ocrPosition367='';ocrFullTSV371='';}","if(isPdf){ocrRows366='';ocrPosition367='';ocrFullTSV371='';ocrRegions372=[];}",'PDF-Zustand')
          anchor="  if(useLines)text+='\\n\\n[Zusätzliche Tabellenzeilen aus OCR-Positionsdaten]\\n'+ocrRows366;"
          new="""  // 3.7.2: Verknuepft echte OCR-Koordinaten vergroesserter Tabellenausschnitte
            // mit dem Originalbild. Auslese-Vorschlaege erfordern weiterhin Kontrolle.
            let found372=0,warnings372=[];
            if(!isPdf&&ocrRegions372.length&&window.PNEUMOPRO_FOCUS372&&window.PNEUMOPRO_FOCUS371){
              try{
                const extra=await window.PNEUMOPRO_FOCUS372.scan(d.blob,ocrRegions372,parsed.rows,window.PNEUMOPRO_FOCUS371,ocrWorker,msg=>setStatus(msg));
                const current=new Map(parsed.rows.map(row=>[row.code,row]));
                for(const row of extra.rows){
                  const before=current.get(row.code);
                  if(before){
                    if(Number.isFinite(before.predicted)&&Number.isFinite(row.predicted)&&Math.abs(before.predicted-row.predicted)>.025){warnings372.push(row.code+': Unterschied bei Sollwert; keine automatische Aenderung.');continue;}
                    if(Number.isFinite(before.actual)&&Number.isFinite(row.actual)&&Math.abs(before.actual-row.actual)>.025){warnings372.push(row.code+': Unterschied bei Istwert; keine automatische Aenderung.');continue;}
                    if(!Number.isFinite(before.percent)&&Number.isFinite(row.percent)){current.set(row.code,{...before,percent:row.percent});found372++;}
                  }else if(Number.isFinite(row.actual)){current.set(row.code,row);found372++;}
                }
                if(found372)parsed={...parsed,rows:[...current.values()]};
                warnings372.push(...extra.warnings);
                if(!found372&&extra.targets)warnings372.push('Zeilen-Nachlesen ergab keine eindeutig zusaetzlichen Zahlen; fehlende Felder bleiben leer.');
              }catch(error){warnings372.push('Erweiterte Tabellenkoordinaten konnten nicht verwendet werden; bisherige Vorschlaege bleiben erhalten.');}
            }
          """+anchor
          replace_one(p,anchor,new,'Gezieltes Lesen aus vergroesserten Tabellenkoordinaten')
          replace_one(p,"let notices=[...parsed.warnings,...focus371Warnings];","let notices=[...parsed.warnings,...focus371Warnings,...warnings372];",'Warnungen anzeigen')
          replace_one(p,"if(focus371Found)notices.push(focus371Found+' zusätzliche Angaben aus gezielt vergrößerten Tabellenzeilen als UNBESTÄTIGTE Vorschläge erkannt. Alle Werte am Original prüfen.');",
          "if(focus371Found)notices.push(focus371Found+' zusätzliche Angaben aus gezielt vergrößerten Tabellenzeilen als UNBESTÄTIGTE Vorschläge erkannt. Alle Werte am Original prüfen.');\n  if(found372)notices.push(found372+' weitere Werte aus zugeordneten Tabellenfoto-Zeilen als UNBESTAETIGTE Vorschlaege: Original pruefen.');",'Transparenz bei Nachleseergebnissen')

          replace_one('secure17.js',"'lungfocus371.js','lungimport365.js'","'lungfocus371.js','lungfocus372.js','lungimport365.js'",'Neuen Scanner laden')
          replace_version('secure17.js')
          replace_one('sw.js',"const VERSION='3.7.1-zeilen-und-prozentspalten';","const VERSION='3.7.2-tabelle-bildposition';",'Service-Worker aktualisieren')
          replace_one('sw.js',"'./lungfocus371.js','./lungfocus371.css',","'./lungfocus371.js','./lungfocus372.js','./lungfocus371.css',",'Offline-Datei vorladen')
          replace_one('sw.js',"const important=['/lungfocus371.js'","const important=['/lungfocus372.js','/lungfocus371.js'",'Wichtigste Cache-Datei aktualisieren')
          replace_version('app.js')
          replace_version('index.html')
          ver.update(version='3.7.2',released='2026-10-31',notes='Gezielte Zeilenerkennung nutzt neben Ganzseiten-OCR jetzt auch originale Bildpositionen aus vergroesserten Tabellenansichten. Erkennt nur lesbare und rechnerisch plausible Angaben; fehlende oder widerspruechliche Zahlen bleiben leer. Status vollstaendig/teilweise/nicht erkannt; keine Veraenderung gespeicherter Originale, lokale verschluesselte Befunde, manuelle Kontrolle zwingend.')
          Path('version.json').write_text(json.dumps(ver,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for file in ['lungfocus372.js','lungimport365.js','secure17.js','app.js']:
              subprocess.run(['node','--check',file],check=True)
          assert json.loads(Path('version.json').read_text(encoding='utf-8'))['version']=='3.7.2'
          assert "'lungfocus371.js','lungfocus372.js','lungimport365.js'" in Path('secure17.js').read_text(encoding='utf-8')
          assert './lungfocus372.js' in Path('sw.js').read_text(encoding='utf-8')
          print('PneumoPro 3.7.2: alle lokalen Syntax- und Versionspruefungen bestanden.')
          PY372_INSTALL
          fi
      - name: Syntaxpruefung und sichere Veroeffentlichung
        shell: bash
        run: |
          node --check lungfocus372.js
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          python3 -c "import json; assert json.load(open('version.json',encoding='utf-8'))['version']=='3.7.2'"
          git diff --check
          git add lungfocus372.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.7.2: vergrösserte Tabellenpositionen fuer Zeilen-OCR"
            git push origin HEAD:main
          else
            echo "PneumoPro 3.7.2 bereits aktuell."
          fi
