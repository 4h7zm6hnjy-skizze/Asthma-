name: PneumoPro 3.6.9 - OCR-Befundzeilen sicher verbinden

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro369_OCR_Befundfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-369-ocr-befundfix
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: OCR-Zusammenfuehrung einfuegen
        shell: bash
        run: |
          python3 - <<'PY_369'
          from pathlib import Path
          import base64, json

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1:
                  raise RuntimeError(f'{path}: Erwartete Stelle nicht eindeutig (Treffer: {n}). Keine Aenderungen committen.')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          def bump_version(path):
              p=Path(path)
              source=p.read_text(encoding='utf-8')
              if '3.6.8' not in source:
                  raise RuntimeError(f'{path}: Version 3.6.8 fehlt. Update abgebrochen.')
              p.write_text(source.replace('3.6.8','3.6.9'),encoding='utf-8')

          state=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if state.get('version')=='3.6.9':
              print('Version 3.6.9 bereits installiert; keine erneute Aenderung erforderlich.')
          elif state.get('version')!='3.6.8':
              raise RuntimeError('Es wird Version 3.6.8 als Ausgangsbasis erwartet.')
          else:
              if Path('lungparser369.js').exists():
                  raise RuntimeError('lungparser369.js existiert bereits. Unvollstaendige Installation kontrollieren.')
              # Nur allgemeine Programmregeln, keine privaten Krankenunterlagen im Quellcode.
              Path('lungparser369.js').write_bytes(base64.b64decode(''))
              replace_once('secure17.js',"'lungparser367.js','lungimport365.js'", "'lungparser367.js','lungparser369.js','lungimport365.js'")
              replace_once('sw.js',"const VERSION='3.6.8-gezieltes-tabellen-ocr';", "const VERSION='3.6.9-ocr-zusammenfuehrung';")
              replace_once('sw.js'," './lungparser366.js','./lungparser367.js',", " './lungparser366.js','./lungparser367.js','./lungparser369.js',")
              replace_once('sw.js',"const important=['/lungparser367.js'", "const important=['/lungparser369.js','/lungparser367.js'")
              anchor=r"  if(useLines)text+='\n\n[Zusätzliche Tabellenzeilen aus OCR-Positionsdaten]\n'+ocrRows366;"
              extension='  // Ein weiterer Lesepfad verbindet getrennte Vollseiten- und Tabellen-OCR.\n  // Die App fuellt nur arithmetisch konsistente, ohne Punktkorrektur lesbare\n  // Zahlen aus benannten Zeilen vor; niemals fehlende Werte erraten.\n  const clean369=window.PNEUMOPRO_PARSER369?.parse(text);\n  const useClean369=!!clean369&&clean369.rows.length>parsed.rows.length;\n  if(useClean369)parsed={...clean369,date:clean369.date||parsed.date};\n  else if(clean369?.date&&!parsed.date)parsed={...parsed,date:clean369.date};\n'
              replace_once('lungimport365.js',anchor,extension+anchor)
              replace_once('lungimport365.js',"  let notices=[...parsed.warnings];", "  let notices=[...parsed.warnings];\n  if(useClean369)notices.push('Weitere Werte aus getrennten OCR-Tabellenteilen als ungepruefte Vorschlaege erkannt. Alle Zahlen und die Messphase am Original kontrollieren.');")
              for name in ['index.html','app.js','secure17.js']:
                  bump_version(name)
              state['version']='3.6.9'
              state['released']='2026-10-31'
              state['notes']='Verbesserte Zusammenfuehrung von Lungenfunktions-OCR aus gesamtem Klinikbogen und separat vergroesserten Tabellen. Erkennt zweistellige Jahreszahlen im Untersuchungsdatum, prueft ausgeschriebene Soll/Ist/%-Tripel rechnerisch und weist unlesbare oder widerspruechliche Werte ausdruecklich zurueck. Keine erfundenen Dezimalstellen; bestaetigungspflichtige Vorschlaege, Originale unveraendert und lokal verschluesselt.'
              Path('version.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('3.6.9: Patch ohne medizinische Privatdaten installiert.')
          PY_369
      - name: Quellcode und vorsichtige Messwertpruefung testen
        shell: bash
        run: |
          node --check lungparser369.js
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          node - <<'JS_TEST'
          const assert=require('node:assert/strict');
          const {parse}=require('./lungparser369.js');
          const good=parse('Messdatum 03.04.26\nTLC 7.00 5.60 80.0\nFVC 5.00 3.75 75.0');
          assert.equal(good.date,'2026-04-03');
          assert.equal(good.rows.length,2);
          assert.equal(good.rows.find(r=>r.code==='FVC').actual,3.75);
          assert.equal(parse('FVC 5.00 3.75 95.0').rows.length,0);
          assert.equal(parse('FVC 500 375 75.0').rows.length,0);
          assert.equal(parse('FVC 5.00 3.75 75.0\nFVC 5.00 4.00 80.0').rows.length,0);
          console.log('OCR 3.6.9: plausible, fehlende und widerspruechliche Werte getestet.');
          JS_TEST
          python3 -c "import json; assert json.load(open('version.json'))['version']=='3.6.9'"
          git diff --check
          git add lungparser369.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.6.9: OCR aus mehreren Tabellenbereichen zusammenfuehren"
            git push origin HEAD:main
          else
            echo "Version bereits aktuell."
          fi
