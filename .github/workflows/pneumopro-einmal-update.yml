          with zipfile.ZipFile(io.BytesIO(payload), 'r') as zipf:
              if sorted(zipf.namelist()) != sorted(files):
                  raise SystemExit('Updatepaket unvollständig: keine Dateien verändert.')
              replacement = {name: zipf.read(name) for name in files}

          version_file = root / 'version.json'
          if not version_file.is_file():
              raise SystemExit('Kein bestehendes PneumoPro/Asthma-Projekt erkannt. Abbruch ohne Änderung.')
          version = json.loads(version_file.read_text(encoding='utf-8')).get('version')
          if version == '3.4.6':
              if all((root/name).is_file() and (root/name).read_bytes() == replacement[name] for name in files):
                  print('PneumoPro 3.4.6 ist bereits vollständig installiert.')
                  raise SystemExit(0)
              raise SystemExit('Version 3.4.6 vorhanden, aber Dateien weichen ab. Kein Überschreiben.')
          if version not in {'3.4.4', '3.4.5'}:
              raise SystemExit('Unbekannte Ausgangsversion '+repr(version)+'. Keine Daten verändert.')

          # Prüfe vor dem ersten Schreiben den vollständigen Quellstand.
          for name in files:
              path = root / name
              if not path.is_file():
                  raise SystemExit('Fehlende Originaldatei: '+name+'. Abbruch ohne Änderung.')
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              if sha not in expected[name]:
                  raise SystemExit('Datei '+name+' wurde inzwischen geändert. Aus Sicherheitsgründen kein Überschreiben.')

          # Validierung der Nutzlast vor der Installation.
          manifest = json.loads(replacement['manifest.webmanifest'])
          assert manifest['short_name'] == 'PneumoPro'
          assert manifest['start_url'] == './' and manifest['scope'] == './'
          assert manifest['icons'][0]['src'] == 'logo-192-v281.png'
          assert json.loads(replacement['version.json'])['version'] == '3.4.6'
          assert b"dbName='asthma-secure-17'" in replacement['secure17.js']
          assert b'Asthma-v17-Vault' in replacement['secure17.js']
          assert b'verifyCurrentPassword' in replacement['secure17.js']
          assert b'secure-forgot-toggle' in replacement['index.html']
          assert b'PneumoPro' in replacement['index.html']
          for item in ('logo-192-v281.png','logo-512-v281.png','logo-home-v281.png','brand-wordmark-v281.png'):
              assert (root/item).is_file(), item

          # Validierung JavaScript ohne Abhängigkeiten von Drittanbietern.
          import tempfile
          with tempfile.TemporaryDirectory() as temp:
              for name in files:
                  if name.endswith('.js'):
                      fn = pathlib.Path(temp)/name
                      fn.write_bytes(replacement[name])
                      subprocess.run(['node','--check',str(fn)],check=True)

          # Erst nach allen Prüfungen App-Dateien überschreiben; nie Browserdaten, Profil oder Backups.
          for name in files:
              (root/name).write_bytes(replacement[name])
          print('PneumoPro 3.4.6 installiert. Enthält Version 3.4.5 mit Offline- und Statistik-Korrekturen.')
          PY_UPDATE
      - name: Vollständige Prüfung und Veröffentlichung
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')" = "3.4.6"
          node --check secure17.js
          node --check suite15.js
          node --check stats25.js
          node --check statsprint296.js
          node --check offline303.js
          node --check statsplus292.js
          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import re
          text=Path('sw.js').read_text(encoding='utf-8')
          m=re.search(r'const ASSETS=\[(.*?)\];',text,re.S)
          assert m,'Offline-Liste fehlt'
          names=re.findall(r"'\./([^']+)'",m.group(1))
          missing=[name for name in names if not Path(name).is_file() and name!='']
          assert not missing, 'Fehlende Offline-Dateien: '+', '.join(missing)
          assert len(names)>=80, 'Unvollständige Offline-Liste'
          print('Offline-Dateien geprüft:',len(names))
          PY_ASSETS
          git config user.name "PneumoPro Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js secure17.js suite15.js styles.css sw.js version.json manifest.webmanifest stats25.js statsprint296.js navigation332.js offline303.js statsplus292.js
          if git diff --cached --quiet; then
            echo 'Schon installiert, keine weiteren Änderungen.'
          else
            git commit -m "PneumoPro 3.4.6: Name, Passwort, 3.4.5 Offline-/Statistikfixes"
            git push origin HEAD:main
          fi
