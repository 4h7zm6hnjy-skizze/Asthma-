      - name: Offline-Funktionen und App-Version prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json;print(json.load(open("version.json"))["version"])')" = "3.4.7"
          node --check ampel347.js
          node --check professional27.js
          node --check metrics340.js
          node --check vital29.js
          node --check stats25.js
          node --check statsplus292.js
          python3 - <<'PY_ASSETS'
          from pathlib import Path
          import re
          text=Path('sw.js').read_text()
          m=re.search(r'const ASSETS=\[(.*?)\];',text,re.S)
          assert m,'Offline-Dateiliste nicht gefunden'
          assets=re.findall(r"'\./([^']*)'",m.group(1))
          assert './ampel347.js' in text and './ampel347.css' in text
          missing=[n for n in assets if n and not Path(n).is_file()]
          assert not missing,'Fehlende Offline-Dateien: '+', '.join(missing)
          print('Offline-Dateien vorhanden:',len(assets))
          PY_ASSETS
          git config user.name 'PneumoPro Update'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ampel347.js ampel347.css version.json index.html stats25.js metrics340.js app.js vital29.js professional27.js secure17.js sw.js statsplus292.js
          if git diff --cached --quiet; then
            echo 'PneumoPro 3.4.7 bereits vorhanden.'
          else
            git commit -m 'PneumoPro 3.4.7: Ampel, Körpergröße, BMI, KOF und Zielband im Gewichtsdiagramm'
            git push origin HEAD:main
          fi
