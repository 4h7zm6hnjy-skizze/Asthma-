name: PneumoPro 3.5.8 - JSON-Schnellimport und Diagramme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro_JSON_Schnellimport_3.5.8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-json-schnellimport-358-main
  cancel-in-progress: false

jobs:
  json-schnellimport:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuelles Projekt laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sichtbaren JSON-Import integrieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import subprocess,json,base64
          VERSION='3.5.8'
          EXPECTED={'secure17.js': 'ca5f9fb2f9425629c27411a045b24122e495658e', 'app.js': 'ea853da482574e69dcb3ac9574abf4a11c7fdb04', 'sw.js': 'ad572f8e83320108967f48f5ffd7a9e3b565c279', 'version.json': '1d444a80bd6ed73ca3c8d40d777a6398b00095c7'}
          package=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if package.get('version')==VERSION and Path('jsoncenter358.js').exists():
              print('Version 3.5.8 bereits vorhanden. Keine Änderungen.')
              raise SystemExit(0)
          if package.get('version')!='3.5.7':
              raise SystemExit('Sicherheitsabbruch: 3.5.7 erwartet, gefunden: '+str(package.get('version')))
          for filename,expected_sha in EXPECTED.items():
              actual=subprocess.check_output(['git','hash-object',filename],text=True).strip()
              if actual!=expected_sha:
                  raise SystemExit('Sicherheitsabbruch: '+filename+' hat einen neueren Stand. Keine Änderungen.')
          def replace_once(file,original,replacement):
              text=Path(file).read_text(encoding='utf-8')
              if text.count(original)!=1:raise SystemExit('Sicherheitsabbruch: Datei '+file+' entspricht nicht dem erwarteten Aufbau.')
              Path(file).write_text(text.replace(original,replacement,1),encoding='utf-8')
          replace_once('secure17.js',"'allergienscan357.js','bewertung348.js'", "'allergienscan357.js','jsoncenter358.js','bewertung348.js'")
          replace_once('secure17.js',"s.src='./'+src+'?v=3.5.7'", "s.src='./'+src+'?v=3.5.8'")
          replace_once('sw.js',"const VERSION='3.5.7-allergien-scan';", "const VERSION='3.5.8-json-direkt';")
          replace_once('sw.js',"const ASSETS=[\n './allergienscan357.js'", "const ASSETS=[\n './jsoncenter358.js','./allergienscan357.js'")
          replace_once('sw.js',"const important=['/allergienscan357.js'", "const important=['/jsoncenter358.js','/allergienscan357.js'")
          replace_once('app.js',"const VERSION = '3.5.7';", "const VERSION = '3.5.8';")
