      - name: Syntax und Integritaet testen
        shell: bash
        run: |
          set -euo pipefail
          node --check jsoncenter358.js
          node --check secure17.js
          node --check app.js
          node --check sw.js
          python3 -m json.tool version.json > /dev/null
          git diff --check
          python3 - <<'PYTEST'
          from pathlib import Path
          import json
          j=Path('jsoncenter358.js').read_text()
          assert 'j358-open' in j and 'j358-scan-cta' in j and 'j358-home' in j
          assert 'dl324-jsontext' in j and 'w342-import' in j and 'labp-import' in j and 'a356-file' in j
          assert "'jsoncenter358.js'" in Path('secure17.js').read_text()
          assert json.loads(Path('version.json').read_text())['version']=='3.5.8'
          assert "'./jsoncenter358.js'" in Path('sw.js').read_text()
          print('PneumoPro 3.5.8: pruefbare Integration erfolgreich')
          PYTEST
      - name: PneumoPro 3.5.8 veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jsoncenter358.js secure17.js app.js sw.js version.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich"
          else
            git commit -m "PneumoPro 3.5.8: JSON direkt, validierte Messwerte in Berichte und Diagramme"
            git push origin HEAD:main
          fi
