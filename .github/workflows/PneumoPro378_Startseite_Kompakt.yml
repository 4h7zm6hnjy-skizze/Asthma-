name: PneumoPro 3.7.8 - Kompakte Startseite und Arztansicht

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro378_Startseite_Kompakt.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-378-startseite-kompakt
  cancel-in-progress: false

jobs:
  installieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: App laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ein-Datei-Update vorbereiten
        shell: bash
        run: |
          python3 - <<'PY_378'
          from pathlib import Path
          import base64,json

          vfile=Path('version.json')
          meta=json.loads(vfile.read_text(encoding='utf-8'))
          version=meta.get('version')
          if version=='3.7.8':
              print('Version 3.7.8 ist bereits installiert. Keine erneute Aenderung.')
          elif version!='3.7.7':
              raise RuntimeError('Erwartete Ausgangsversion 3.7.7 fehlt. App-Dateien bleiben unveraendert.')
          else:
              def one(filename,old,new):
                  file=Path(filename)
                  before=file.read_text(encoding='utf-8')
                  hits=before.count(old)
                  if hits!=1:
                      raise RuntimeError(f'{filename}: erwarteter Marker nicht eindeutig ({hits}). Aenderung abgebrochen.')
                  file.write_text(before.replace(old,new,1),encoding='utf-8')
              def replace_version(filename):
                  file=Path(filename)
                  before=file.read_text(encoding='utf-8')
                  if '3.7.7' not in before:
                      raise RuntimeError(f'{filename}: Ausgangsversion nicht gefunden.')
                  file.write_text(before.replace('3.7.7','3.7.8'),encoding='utf-8')
              if Path('dashboard378.js').exists():
                  raise RuntimeError('dashboard378.js existiert bereits bei falscher App-Version.')
              # Erst nach Markerprüfung schreiben; kein Zugriff auf verschluesselte Eintraege.
              for path,mark in [
                  ('secure17.js',"'lungsplit374.js','tidy375.js','dashboard376.js','dashboard377.js'];"),
                  ('sw.js',"const VERSION='3.7.7-start-professional';"),
                  ('sw.js',"'./weight292.js','./tidy375.js','./dashboard376.js','./dashboard377.js','./medpref25.js'")]:
                  if Path(path).read_text(encoding='utf-8').count(mark)!=1:
                      raise RuntimeError('Installationsmarker fehlt/mehrdeutig: '+path)
              Path('dashboard378.js').write_bytes(base64.b64decode(''))
              one('secure17.js',
                  "'lungsplit374.js','tidy375.js','dashboard376.js','dashboard377.js'];",
                  "'lungsplit374.js','tidy375.js','dashboard376.js','dashboard377.js','dashboard378.js'];")
              replace_version('secure17.js')
              replace_version('index.html')
              one('sw.js',
                  "const VERSION='3.7.7-start-professional';",
                  "const VERSION='3.7.8-kompakte-startseite';")
              one('sw.js',
                  "'./weight292.js','./tidy375.js','./dashboard376.js','./dashboard377.js','./medpref25.js'",
                  "'./weight292.js','./tidy375.js','./dashboard376.js','./dashboard377.js','./dashboard378.js','./medpref25.js'")
              meta['version']='3.7.8'
              meta['released']='2026-10-31'
              meta['notes']='Kompakte Startseite ohne doppelte Diagramme und Alt-Kacheln. Treppenzaehler mit direkter manueller Erfassung, eigene aertztliche Bildschirmuebersicht mit zuletzt gespeicherten Werten, Beschwerden, Medikamenten und Terminen. Detailverlaeufe in Lunge, Vital und Peak-Flow unveraendert. Copyright Marcel Hentschel 2026.'
              vfile.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('PneumoPro 3.7.8: kompakte Startseite installiert, private Daten unveraendert.')
          PY_378
      - name: Syntax und Verknuepfungen pruefen
        shell: bash
        run: |
          set -e
          node --check dashboard378.js
          node --check dashboard377.js
          node --check dashboard376.js
          node --check tidy375.js
          node --check secure17.js
          node --check suite15.js
          node --check navigation332.js
          node --check sw.js
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY_QA'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text(encoding='utf-8'))['version']=='3.7.8'
          s=Path('secure17.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          d=Path('dashboard378.js').read_text(encoding='utf-8')
          assert "'dashboard377.js','dashboard378.js'" in s
          assert "'./dashboard377.js','./dashboard378.js'" in sw
          assert '3.7.8' in Path('index.html').read_text(encoding='utf-8')
          for marker in ['pp378-toolbar','pp378-stairs-card','pp378-modal','pp378-steps-form','asthma:secure-change','Treppen erfassen','Arztbericht','PNEUMOPRO_DASHBOARD378']:
              assert marker in d,marker
          assert "S.put('suite'" in d
          assert '© Marcel Hentschel 2026' in Path('dashboard377.js').read_text(encoding='utf-8')
          print('Syntax-, Modul-, Datenmodell-, Startseite- und Versionstests OK.')
          PY_QA
          git diff --check
      - name: Nur App-Dateien veroeffentlichen
        shell: bash
        run: |
          set -e
          git add dashboard378.js secure17.js sw.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Version 3.7.8 bereits veroeffentlicht.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'PneumoPro 3.7.8: kompakte Startseite, Treppenzaehler und Arztansicht'
            git push origin HEAD:main
          fi
