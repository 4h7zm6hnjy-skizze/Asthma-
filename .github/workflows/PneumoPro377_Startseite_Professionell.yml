name: PneumoPro 3.7.7 - Startseite professionell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro377_Startseite_Professionell.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-377-startseite-professionell
  cancel-in-progress: false

jobs:
  installieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: App laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ein-Datei-Update installieren
        shell: bash
        run: |
          python3 - <<'PY_377'
          from pathlib import Path
          import base64, json

          target=Path('version.json')
          current=json.loads(target.read_text(encoding='utf-8'))
          if current.get('version') == '3.7.7':
              print('PneumoPro 3.7.7 ist bereits installiert.')
          elif current.get('version') != '3.7.6':
              raise RuntimeError('Erwartete Version 3.7.6 fehlt. Zur Sicherheit keine Aenderungen.')
          else:
              def replace_once(filename, before, after):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  count=original.count(before)
                  if count != 1:
                      raise RuntimeError(f'{filename}: erwarteter Marker nicht eindeutig: {count} Treffer.')
                  path.write_text(original.replace(before, after, 1), encoding='utf-8')
              def replace_version(filename):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  if '3.7.6' not in original:
                      raise RuntimeError(f'{filename}: Version 3.7.6 fehlt.')
                  path.write_text(original.replace('3.7.6','3.7.7'), encoding='utf-8')
              if Path('dashboard377.js').exists():
                  raise RuntimeError('dashboard377.js existiert bereits, aber Version passt nicht.')
              Path('dashboard377.js').write_bytes(base64.b64decode(''))
              replace_once('secure17.js',
                  "'lungsplit374.js','tidy375.js','dashboard376.js'];",
                  "'lungsplit374.js','tidy375.js','dashboard376.js','dashboard377.js'];")
              replace_version('secure17.js')
              replace_version('index.html')
              replace_once('sw.js',
                  "const VERSION='3.7.6-start-dashboard';",
                  "const VERSION='3.7.7-start-professional';")
              replace_once('sw.js',
                  "'./weight292.js','./tidy375.js','./dashboard376.js','./medpref25.js'",
                  "'./weight292.js','./tidy375.js','./dashboard376.js','./dashboard377.js','./medpref25.js'")
              current['version']='3.7.7'
              current['released']='2026-10-31'
              current['notes']='Startseite verfeinert: alte Box "Heute im Blick" entfernt, die Kacheln mit den letzten Messwerten an den Seitenanfang verschoben, der Zusatz "ohne Schnickschnack" entfernt und Copyright © Marcel Hentschel 2026 hinzugefuegt. Bestehende Daten und Diagramme bleiben unveraendert.'
              target.write_text(json.dumps(current, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              print('Update vorbereitet: Version 3.7.7; Startseite professionell aufgeraeumt.')
          PY_377
      - name: Dateien auf Syntax, Version und Funktionen pruefen
        shell: bash
        run: |
          set -e
          node --check dashboard376.js
          node --check dashboard377.js
          node --check tidy375.js
          node --check secure17.js
          node --check sw.js
          python3 -m json.tool version.json > /dev/null
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text())['version']=='3.7.7'
          assert "'lungsplit374.js','tidy375.js','dashboard376.js','dashboard377.js'" in Path('secure17.js').read_text()
          assert "'./weight292.js','./tidy375.js','./dashboard376.js','./dashboard377.js'" in Path('sw.js').read_text()
          t=Path('dashboard377.js').read_text(encoding='utf-8')
          for marker in ['a28-daily','pp377-copyright','© Marcel Hentschel 2026','PNEUMOPRO_DASHBOARD377']:
              assert marker in t, marker
          print('Alle Installations- und Syntaxkontrollen bestanden.')
          PY_CHECK
          git diff --check
      - name: Update automatisch veroeffentlichen
        shell: bash
        run: |
          set -e
          git add dashboard377.js secure17.js sw.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Update bereits installiert.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'PneumoPro 3.7.7: Startseite aufraeumen und professionalisieren'
            git push origin HEAD:main
          fi
