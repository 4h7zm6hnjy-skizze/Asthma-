name: PneumoPro 3.7.6 - Startseite mit Kacheln

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro376_Startseite_Kacheln.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-376-startseite-kacheln
  cancel-in-progress: false

jobs:
  installieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: App laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ein-Datei-Update installieren
        shell: bash
        run: |
          python3 - <<'PY_376'
          from pathlib import Path
          import base64, json

          target=Path('version.json')
          current=json.loads(target.read_text(encoding='utf-8'))
          if current.get('version') == '3.7.6':
              print('PneumoPro 3.7.6 ist bereits installiert.')
          elif current.get('version') != '3.7.5':
              raise RuntimeError('Erwartete Version 3.7.5 fehlt. Zur Sicherheit keine Aenderungen.')
          else:
              def replace_once(filename, before, after):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  count=original.count(before)
                  if count != 1:
                      raise RuntimeError(f'{filename}: erwarteter Marker nicht eindeutig: {count} Treffer.')
                  path.write_text(original.replace(before, after, 1), encoding='utf-8')
              def replace_version(filename):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  if '3.7.5' not in original:
                      raise RuntimeError(f'{filename}: Version 3.7.5 fehlt.')
                  path.write_text(original.replace('3.7.5','3.7.6'), encoding='utf-8')
              if Path('dashboard376.js').exists():
                  raise RuntimeError('dashboard376.js existiert bereits, aber Version passt nicht.')
              Path('dashboard376.js').write_bytes(base64.b64decode(''))
              replace_once('secure17.js',
                  "'lungsplit374.js','tidy375.js'];",
                  "'lungsplit374.js','tidy375.js','dashboard376.js'];")
              replace_version('secure17.js')
              replace_version('index.html')
              replace_once('sw.js',
                  "const VERSION='3.7.5-gewicht-messlisten';",
                  "const VERSION='3.7.6-start-dashboard';")
              replace_once('sw.js',
                  "'./weight292.js','./tidy375.js','./medpref25.js'",
                  "'./weight292.js','./tidy375.js','./dashboard376.js','./medpref25.js'")
              current['version']='3.7.6'
              current['released']='2026-10-31'
              current['notes']='Einfache Startseite mit Kacheln fuer die letzten Messwerte auf einen Blick: SpO2, Blutdruck, Puls, Gewicht, FEV1, FVC und Peak-Flow. Mit Ampelprinzip, Datum und direktem Zugriff auf Vitalwerte, Lungenfunktion und Peak-Flow. Bestehende Daten, Diagramme und Speicher bleiben unveraendert.'
              target.write_text(json.dumps(current, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              print('Update vorbereitet: Version 3.7.6; Startseiten-Kacheln mit Ampelprinzip hinzugefuegt.')
          PY_376
      - name: Dateien auf Syntax, Version und Funktionen pruefen
        shell: bash
        run: |
          set -e
          node --check dashboard376.js
          node --check tidy375.js
          node --check secure17.js
          node --check sw.js
          node --check app.js
          python3 -m json.tool version.json > /dev/null
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text())['version']=='3.7.6'
          assert "'lungsplit374.js','tidy375.js','dashboard376.js'" in Path('secure17.js').read_text()
          assert "'./weight292.js','./tidy375.js','./dashboard376.js'" in Path('sw.js').read_text()
          t=Path('dashboard376.js').read_text(encoding='utf-8')
          for marker in ['pp376-dashboard','pp376-grid','vitalwerte','lungenwerte','peakflow','PNEUMOPRO_DASHBOARD376']:
              assert marker in t, marker
          print('Alle Installations- und Syntaxkontrollen bestanden.')
          PY_CHECK
          git diff --check
      - name: Update automatisch veroeffentlichen
        shell: bash
        run: |
          set -e
          git add dashboard376.js secure17.js sw.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Update bereits installiert.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'PneumoPro 3.7.6: Startseite mit Kacheln und Ampelprinzip'
            git push origin HEAD:main
          fi
