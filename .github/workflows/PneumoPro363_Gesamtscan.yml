name: PneumoPro 3.6.3 Dokument-Scan fuer alle Bilder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro363_Gesamtscan.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-363-gesamt
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kopier- und Diagrammfunktionen installieren
        shell: bash
        run: |
          python3 - <<'PY_SCAN_ALL'
          from pathlib import Path
          import base64, json, subprocess

          def one(src,old,new,label):
              if src.count(old)!=1:
                  raise RuntimeError(f'{label}: Erwartete Ausgangsstelle nicht eindeutig, Update abgebrochen.')
              return src.replace(old,new,1)

          def edit(path,fn):
              f=Path(path)
              if not f.is_file():raise RuntimeError(path+' fehlt.')
              old=f.read_text(encoding='utf-8')
              new=fn(old)
              if old==new:raise RuntimeError(path+' wurde nicht aktualisiert.')
              f.write_text(new,encoding='utf-8')

          meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if meta.get('version')=='3.6.3':
              print('PneumoPro 3.6.3 bereits vorhanden.')
              raise SystemExit(0)
          if meta.get('version')!='3.6.2':
              raise RuntimeError('Dieses Update erwartet die installierte Version 3.6.2.')
          # Alle Dateien enthalten ausschliesslich Programmcode, keinerlei Befundbilder oder Patientendaten.
          Path('rawcharts363.js').write_bytes(base64.b64decode(''))
          Path('rawcharts363.css').write_bytes(base64.b64decode(''))
          Path('doccopy363.js').write_bytes(base64.b64decode(''))
          Path('doccopy363.css').write_bytes(base64.b64decode(''))

          def patch_secure(s):
              s=one(s,"'ocr360.js'];","'ocr360.js','rawcharts363.js','doccopy363.js'];",'Skriptfolge')
              return one(s,"s.src='./'+src+'?v=3.6.2'","s.src='./'+src+'?v=3.6.3'",'Skriptversionsnummer')
          edit('secure17.js',patch_secure)
          edit('app.js',lambda s:one(s,"const VERSION = '3.6.2';","const VERSION = '3.6.3';",'App-Version'))
          def patch_sw(s):
              s=one(s,"const VERSION='3.6.2-echte-originale';","const VERSION='3.6.3-alle-scan-kopien';",'Offline-Version')
              s=one(s,'const ASSETS=[',"const ASSETS=[\n './rawcharts363.js','./rawcharts363.css','./doccopy363.js','./doccopy363.css',",'Offline-Vorladen')
              s=one(s,'const important=[',"const important=['/rawcharts363.js','/rawcharts363.css','/doccopy363.js','/doccopy363.css',",'Cache-Erneuerung')
              return s
          edit('sw.js',patch_sw)
          def patch_html(s):
              if '3.6.2' not in s:raise RuntimeError('HTML-Version 3.6.2 fehlt.')
              s=one(s,'</head>', '<link rel="stylesheet" href="./rawcharts363.css?v=3.6.3"/>\n<link rel="stylesheet" href="./doccopy363.css?v=3.6.3"/>\n</head>','Scan-Stylesheets')
              return s.replace('3.6.2','3.6.3')
          edit('index.html',patch_html)
          def patch_version(s):
              info=json.loads(s)
              info.update(version='3.6.3',released='2026-10-31',notes='Echte Klinikdiagramme vom 28.10.2026 als saubere, angetippte Ausschnitte direkt in Deine Lungenwerte. Alle bereits gespeicherten und neu angezeigten Dokumentbilder erhalten automatisch eine lokale, optisch optimierte Scan-Kopie mit konservativer Randerkennung. Bei fehlender Erkennung bleibt das Original sichtbar. Originale werden nie ueberschrieben; Umschalter Kopie/Original, Zoom und Offline-Funktion. Keine Patientendaten in GitHub.')
              return json.dumps(info,ensure_ascii=False,indent=2)+'\n'
          edit('version.json',patch_version)
          for p in ['rawcharts363.js','doccopy363.js','secure17.js','app.js','sw.js']:
              subprocess.run(['node','--check',p],check=True)
          assert "'rawcharts363.js','doccopy363.js'" in Path('secure17.js').read_text()
          assert 'doccopy363.css' in Path('index.html').read_text()
          assert '3.6.3'==json.loads(Path('version.json').read_text())['version']
          print('Programm-Syntax und Einbindung geprüft. Vorhandene Tresordaten unverändert.')
          PY_SCAN_ALL
      - name: Neue Version veroeffentlichen
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rawcharts363.js rawcharts363.css doccopy363.js doccopy363.css secure17.js app.js sw.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Aktueller Stand bereits veroeffentlicht.'
          else
            git commit -m 'PneumoPro 3.6.3: scanartige Dokumentkopien und Klinikdiagramme'
            git push origin HEAD:main
          fi
