name: PneumoPro 3.7.0 - sichere OCR-Teilwerte sichtbar machen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro370_Teilwerte_OCR.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-370-ocr-teilerkennung
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nur OCR-Auswertung und Anzeige aktualisieren
        shell: bash
        run: |
          python3 - <<'PY_370'
          from pathlib import Path
          import base64,json

          def one(path,old,new,tag):
              p=Path(path)
              source=p.read_text(encoding='utf-8')
              hits=source.count(old)
              if hits!=1: raise RuntimeError(f'{tag}: erwartetes Muster einmal, gefunden {hits}. Keine Aenderung uebernehmen.')
              p.write_text(source.replace(old,new,1),encoding='utf-8')

          def version(path,old='3.6.9',new='3.7.0'):
              p=Path(path)
              value=p.read_text(encoding='utf-8')
              if old not in value: raise RuntimeError(f'{path}: alte Versionsmarke fehlt; kein Update.')
              p.write_text(value.replace(old,new),encoding='utf-8')

          state=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if state['version']=='3.7.0':
              print('3.7.0 ist bereits vorhanden.')
          elif state['version']!='3.6.9':
              raise RuntimeError('PneumoPro 3.6.9 wird als Ausgangsversion erwartet.')
          else:
              if Path('lungparser370.js').exists(): raise RuntimeError('lungparser370.js ist bereits vorhanden; bitte Versionierung pruefen.')
              Path('lungparser370.js').write_bytes(base64.b64decode(""))
              one('secure17.js',"'lungparser369.js','lungimport365.js'","'lungparser369.js','lungparser370.js','lungimport365.js'",'Ladefolge')
              one('sw.js',"const VERSION='3.6.9-ocr-zusammenfuehrung';","const VERSION='3.7.0-teilwerte-ocr';",'Cache-Stand')
              one('sw.js'," './lungparser366.js','./lungparser367.js','./lungparser369.js',"," './lungparser366.js','./lungparser367.js','./lungparser369.js','./lungparser370.js',",'Offline Parser')
              one('sw.js',"const important=['/lungparser369.js'","const important=['/lungparser370.js','/lungparser369.js'",'Erzwungene Aktualisierung')
              old="  if(useLines)text+='\\n\\n[Zusätzliche Tabellenzeilen aus OCR-Positionsdaten]\\n'+ocrRows366;"
              insertion='  // Teilweise lesbare Zahlen getrennt von vollstaendigen Werten behandeln.\n  // Niemals Prozentwerte aus der Rechnung als gemessene Angaben erfinden.\n  const supplement370=window.PNEUMOPRO_PARSER370?.parse(text);\n  const supplement370Rows=[],supplement370Conflicts=[];\n  if(supplement370?.rows){\n    const present=new Map(parsed.rows.map(r=>[r.code,r]));\n    for(const row of supplement370.rows){\n      const existing=present.get(row.code);\n      if(existing){\n        if(Number.isFinite(existing.actual)&&Math.abs(existing.actual-row.actual)>.03) supplement370Conflicts.push(row.code);\n      }else{supplement370Rows.push(row);present.set(row.code,row);}\n    }\n    if(supplement370Rows.length)parsed={...parsed,rows:[...parsed.rows,...supplement370Rows]};\n  }\n'
              one('lungimport365.js',old,insertion+old,'Teilwert-Vervollstaendigung')
              old="  let notices=[...parsed.warnings];"
              new="  let notices=[...parsed.warnings];\n  if(supplement370Rows.length)notices.push(supplement370Rows.length+' Parameter mit lesbaren Soll-/Istwerten, aber ohne sichere Prozentangabe. Die Prozentfelder bleiben leer. Alle Vorschlaege am Original kontrollieren.');\n  if(supplement370Conflicts.length)notices.push('OCR widerspricht vorhandenen Werten bei: '+supplement370Conflicts.join(', ')+'. Bitte mit dem Original vergleichen; die bestaetigtere vollstaendige Zeile bleibt unveraendert.');"
              one('lungimport365.js',old,new,'Teilwertwarnungen')
              old=" const missing=defs[$('li365-type').value]?.length-(parsed.rows.filter(x=>defs[$('li365-type').value].some(v=>v[0]===x.code)).length)||0;"
              new=" const missing=defs[$('li365-type').value]?.filter(v=>!parsed.rows.some(x=>x.code===v[0]&&x.percent!==null&&x.percent!==undefined)).length||0;"
              one('lungimport365.js',old,new,'Vollstaendigkeitszaehlung')
              old="$('li365-time').value='';"
              new="const matchTime370=text.match(/\\b(?:Messzeit|Untersuchungszeit|Uhrzeit)\\s*[:\\-]?\\s*([01]?\\d|2[0-3])[:.]([0-5]\\d)\\b/i);$('li365-time').value=matchTime370?matchTime370[1].padStart(2,'0')+':'+matchTime370[2]:'';"
              one('lungimport365.js',old,new,'Eindeutig beschriftete Messzeit')
              old="setStatus(parsed.rows.length+' vorsichtige Wertvorschläge erkannt; bitte alle Angaben vergleichen. Diagramme separat manuell markieren.');"
              new="setStatus(parsed.rows.filter(x=>x.percent!==null&&x.percent!==undefined).length+' vollstaendige und '+parsed.rows.filter(x=>x.percent===null||x.percent===undefined).length+' teilweise Messwertvorschlaege erkannt; bitte alle Zahlen am Original vergleichen. Diagramme manuell markieren.');"
              one('lungimport365.js',old,new,'Genaue Anzeige des Pruefstands')
              for name in ['app.js','index.html','secure17.js']:version(name)
              state.update(version='3.7.0',released='2026-10-31',notes='Teilerkannte Soll/Ist-Messwerte werden separat als unbestaetigte OCR-Vorschlaege gezeigt. Keine automatische Ergaenzung fehlender Prozentwerte oder verlorener Dezimalzeichen. Vollstaendigkeit nur bei tatsaechlich abgelesenen Soll/Ist/Prozent-Spalten; OCR-Konflikte werden gewarnt und nicht ueberschrieben. Messzeit kann aus eindeutigem Messzeit-Feld vorbelegt werden. Originaldateien bleiben verschluesselt und unveraendert.')
              Path('version.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('PneumoPro 3.7.0: nur Programmdateien, keine privaten Befunde veraendert.')
          PY_370
      - name: Programm und Sicherheitschecks pruefen
        shell: bash
        run: |
          node --check lungparser370.js
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          node - <<'JS_370'
          const assert=require('node:assert/strict');
          const {parse}=require('./lungparser370.js');
          const result=parse('sR eff 1.28 0.78 609\nR eff 0.41 0.31 ?\nFVC 5.50 4.40 80.0');
          assert.equal(result.rows.length,2);
          assert.equal(result.rows.find(r=>r.code==='sR_eff').percent,null);
          assert.equal(parse('FVC 5.50 4.40 80.0').rows.length,0);
          assert.equal(parse('FVC 550 440 80.0').rows.length,0);
          assert.equal(parse('FVC 5.50 4.40 800\nFVC 5.50 3.40 800').rows.length,0);
          console.log('Teilwerte, Widersprueche und fehlende Dezimalzeichen geprueft.');
          JS_370
          python3 -c "import json;assert json.load(open('version.json'))['version']=='3.7.0'"
          git diff --check
          git add lungparser370.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.7.0: nur sichere OCR-Teilwerte anzeigen"
            git push origin HEAD:main
          else
            echo "PneumoPro 3.7.0 bereits vorhanden."
          fi
