name: PneumoPro 3.5.9 - JSON-Import sichtbar reparieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro_JSON_Sichtbar_Fix_3.5.9.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-json-sichtbar359-main
  cancel-in-progress: false

jobs:
  json-sichtbarkeit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen App-Stand laden
        uses: actions/checkout@v4
      - name: JSON-Schnellzugriff dauerhaft sichtbar machen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import json, subprocess, base64
          VERSION='3.5.9'
          EXPECTED={'jsoncenter358.js': '583d6c1118231a7e7fc230596c6b590408dda08c', 'app.js': '10ba5384e542fda90c36a65f8871f6e95bad25ca', 'secure17.js': '437ca13e240af40fcefc04c828e4556cc170d0ca', 'sw.js': '6dc3274973a2b9be320eeab396943999f0218db3', 'version.json': 'fc2507f6dcb03fced4585f9c85f48274d2afa604'}
          current=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if current.get('version')==VERSION:
           print('PneumoPro 3.5.9 bereits vorhanden. Keine Dateien geaendert.')
           raise SystemExit(0)
          if current.get('version')!='3.5.8':
           raise SystemExit('Sicherheitsabbruch: 3.5.8 erwartet, vorgefunden '+str(current.get('version')))
          for path,sha in EXPECTED.items():
           actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
           if actual!=sha:raise SystemExit('Sicherheitsabbruch: '+path+' abweichend. Kein Ueberschreiben.')
          def patch(path,old,new):
           s=Path(path).read_text(encoding='utf-8')
           if s.count(old)!=1:raise SystemExit('Sicherheitsabbruch: Textstelle '+path+' nicht eindeutig ('+str(s.count(old))+').')
           Path(path).write_text(s.replace(old,new,1),encoding='utf-8')
          patch('app.js',"const VERSION = '3.5.8';","const VERSION = '3.5.9';")
          patch('app.js','  // 3.5.4: Apple-Health-Import über Kurzbefehle, ohne Netzwerk oder HealthKit in Safari.',"  // 3.5.9: Sichtbarer JSON-Schnellzugriff direkt im bereits aktiven Hauptprogramm.\n  // Verhindert, dass ein verzoegert/alt geladenes separates Modul den Zugang versteckt.\n  (function ensureVisibleJSON359(){\n    const top=document.querySelector('#secure-application .top-actions'),start=document.getElementById('start');\n    if(!top||!start)return;\n    const style=document.createElement('style');style.id='j359-style';\n    style.textContent='#j359-entry,#j358-open{display:inline-flex!important;visibility:visible!important;opacity:1!important;align-items:center;justify-content:center;min-height:43px;min-width:82px;border:2px solid #14748b;border-radius:11px;background:#096980;color:white;font:inherit;font-size:13px;font-weight:850;padding:8px 11px;white-space:nowrap;cursor:pointer;flex:1 1 92px}#j359-home{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#e3f5f9;border:2px solid #15829a;border-radius:14px;padding:13px;margin:12px 16px;color:#143e52}#j359-home strong{font-size:1rem}#j359-home button{border:0;border-radius:10px;background:#086783;color:white;font:inherit;font-weight:850;padding:12px 16px;min-height:46px;cursor:pointer}@media(max-width:720px){#secure-application header.topbar,#secure-application header.topbar .topbar-inner{height:auto!important;min-height:112px!important}#secure-application header.topbar .top-actions{display:flex!important;flex-wrap:wrap!important;row-gap:6px!important;width:100%!important}#j359-home{margin:12px 8px}}';\n    document.head.append(style);\n    const entry=document.createElement('button');entry.type='button';entry.id='j359-entry';entry.textContent='JSON-Import';entry.setAttribute('aria-label','JSON-Datei direkt importieren');\n    const search=document.getElementById('nav317-holder'),menu=document.getElementById('n332-open-top');\n    top.insertBefore(entry,(search?.parentNode===top?search:null)||(menu?.parentNode===top?menu:null)||top.firstChild);\n    function showImport(){\n      const dlg=document.getElementById('j358-dialog');\n      if(dlg){if(!dlg.open)dlg.showModal();return}\n      if(document.getElementById('j359-loader'))return;\n      const script=document.createElement('script');script.id='j359-loader';script.src='./jsoncenter358.js?v=3.5.9';\n      script.onload=()=>{script.removeAttribute('id');const loaded=document.getElementById('j358-dialog');if(loaded){if(!loaded.open)loaded.showModal()}else alert('Der JSON-Import konnte nicht gestartet werden. Bitte die aktualisierte App online erneut oeffnen.');};\n      script.onerror=()=>{script.remove();alert('JSON-Modul nicht geladen. Internet und App-Version 3.5.9 pruefen.');};\n      document.body.append(script);\n    }\n    entry.addEventListener('click',showImport);\n    if(!document.getElementById('j359-home')){\n      const panel=document.createElement('div');panel.id='j359-home';\n      const label=document.createElement('strong');label.textContent='JSON-Datei direkt importieren – ohne Suchen';\n      const action=document.createElement('button');action.type='button';action.textContent='JSON-Datei auswaehlen';action.addEventListener('click',showImport);\n      panel.append(label,action);start.insertBefore(panel,start.firstChild);\n    }\n  })();\n\n  // 3.5.4: Apple-Health-Import über Kurzbefehle, ohne Netzwerk oder HealthKit in Safari.")
          patch('secure17.js',"s.src='./'+src+'?v=3.5.8'","s.src='./'+src+'?v=3.5.9'")
          patch('sw.js',"const VERSION='3.5.8-json-direkt';","const VERSION='3.5.9-json-sichtbar';")
          Path('jsoncenter358.js').write_bytes(base64.b64decode(''))
          Path('version.json').write_text(json.dumps({'version':VERSION,'released':'2026-10-30','notes':'JSON-Import jetzt garantiert als direkte sichtbare Schaltflaeche oben und auf der Startseite. Bestehende Fachimporte fuer Allergien, Lungenfunktion, Diffusion, Labor und Gehtest inklusive Diagrammen/Statistiken bleiben unveraendert. Korrigierter Startseitenanker und Lade-Fallback; keine Aenderung an lokalen Gesundheitsdaten.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PneumoPro 3.5.9: Schnellzugriff und Modul-Ladeabsicherung aktualisiert.')
          PYUPDATE
      - name: Syntax und Datenintegritaet pruefen
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check jsoncenter358.js
          node --check secure17.js
          node --check sw.js
          python3 -m json.tool version.json >/dev/null
          git diff --check
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import json
          a=Path('app.js').read_text()
          j=Path('jsoncenter358.js').read_text()
          assert 'ensureVisibleJSON359' in a and 'j359-entry' in a and 'j359-home' in a
          assert "const home=$('start')" in j
          assert "$('j359-entry')" in j
          assert json.loads(Path('version.json').read_text())['version']=='3.5.9'
          print('JSON direkt im Hauptprogramm sichtbar: statische Pruefung OK')
          PYVERIFY
      - name: Geprueftes Update veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js jsoncenter358.js secure17.js sw.js version.json
          if git diff --cached --quiet; then
            echo 'Bereits auf Stand 3.5.9'
          else
            git commit -m "PneumoPro 3.5.9: JSON direkt sichtbar, Laden abgesichert"
            git push origin HEAD:main
          fi
