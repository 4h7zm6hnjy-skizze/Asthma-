name: PneumoPro 3.6.1 - Performance QA stabiler Browserstart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro_Performance_QA_Stable_3.6.1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-performance-361-main
  cancel-in-progress: false

jobs:
  pruefen-optimieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Aktuelle PneumoPro-Dateien laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Performance-Korrekturen mit Versionsschutz anwenden
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          from pathlib import Path
          import json, subprocess, re
          VERSION='3.6.1'
          PREVIOUS='3.6.0'
          EXPECTED={
              'secure17.js':'744ebe4a9de789ef3ac3a390db809a0862f3e630',
              'app.js':'53457474f50af22ceb65abd1524ca387a31ef694',
              'sw.js':'770e83ad9aece0a1f62e8305a63f67b8e2e6deb4',
              'search360.js':'36718ef3892833553acf33ec716e3c0cbfa29ff1',
              'ocr360.js':'c239ce93f3cb13bf926309d72dd81da6cdd53685',
              'version.json':'1b9f4cb5c49ae7b5d13427349221a3ed4cb5af83',
          }
          for name, expected in EXPECTED.items():
              if not Path(name).is_file():raise SystemExit('Sicherheitsabbruch: '+name+' fehlt.')
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              if actual!=expected:raise SystemExit('Sicherheitsabbruch: '+name+' hat sich seit der Prüfung geändert. Nicht überschrieben.')
          
          def one(src,old,new,why):
              count=src.count(old)
              if count!=1:raise SystemExit('Sicherheitsabbruch: '+why+' Anker nicht eindeutig ('+str(count)+')')
              return src.replace(old,new,1)
          
          v=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if v.get('version')!=PREVIOUS:raise SystemExit('Aktuelle Version nicht 3.6.0; keine Änderungen vorgenommen.')
          src={name:Path(name).read_text(encoding='utf-8') for name in EXPECTED}
          
          # 1. Suchdurchlauf: dieselben verschlüsselten Gruppen nur einmal aus IndexedDB lesen.
          s=src['secure17.js']
          insert="""  // Performance: alle angeforderten Gruppen in EINEM Datenbank-Durchlauf laden.
            // Keine Cloud-Verbindung, keine dauerhafte Klartextkopie; Tresor muss entsperrt sein.
            async function listGroups(names){
              requireUnlock();
              if(!Array.isArray(names)||names.length>30||names.some(n=>typeof n!=='string'||!/^[a-z][a-z0-9_-]{0,39}$/.test(n)))throw Error('Ungültige Suchgruppen');
              const result=Object.fromEntries([...new Set(names)].map(n=>[n,[]]));
              const rows=await rawAll();
              for(const row of rows){
                const slash=row.id.indexOf('/');if(slash<1)continue;
                const group=row.id.slice(0,slash);
                if(!Object.prototype.hasOwnProperty.call(result,group))continue;
                result[group].push(await decodeRecord(await unseal(row)));
              }
              return result;
            }
          """
          s=one(s,'  async function findOne(group,id){',insert+'  async function findOne(group,id){','Gesammelte Lesefunktion')
          s=one(s,'const API={list:find,get:findOne,','const API={list:find,listGroups,get:findOne,','Neue Gruppenlesefunktion freigeben')
          # Browser test showed that unlimited parallel dynamic script loading can leave dependent modules unavailable.
          # Preserve the original, verified sequential script execution and version all script requests.
          old="for(const src of scripts){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./'+src+'?v=3.6.0';s.onload=resolve;s.onerror=()=>reject(Error(src+' konnte nicht geladen werden'));document.body.append(s)})}"
          new="for(const src of scripts){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./'+src+'?v=3.6.1';s.onload=resolve;s.onerror=()=>reject(Error(src+' konnte nicht geladen werden'));document.body.append(s)})}"
          s=one(s,old,new,'Geordnete Script-Ausführung erhalten')
          src['secure17.js']=s
          
          s=src['search360.js']
          s=one(s,"   for(const [group,category,page] of groups){", "   const grouped=await S.listGroups(groups.map(item=>item[0]));\n   for(const [group,category,page] of groups){",'Suchgruppen einmal lesen')
          s=one(s,"    const rows=await S.list(group);","    const rows=grouped[group]||[];",'Wiederholte Datenbanksuche vermeiden')
          src['search360.js']=s
          
          # 2. OCR Engine on demand. Only DE model is needed for most German reports.
          s=src['ocr360.js']
          s=one(s,'<label for="ocr360-select">Gespeicherte Datei</label>',
          '''<label for="ocr361-lang">Erkennungssprache</label><select id="ocr361-lang"><option value="deu">Deutsch (schneller, weniger Speicher)</option><option value="eng">Englisch</option><option value="both">Deutsch + Englisch</option></select>
           <label for="ocr360-select">Gespeicherte Datei</label>''','OCR Sprachwahl')
          s=one(s,"let selected=null,busy=false,currentText='',worker=null,structured=null;", "let selected=null,busy=false,currentText='',worker=null,workerLanguage='',structured=null;",'OCR Workerstatus')
          s=one(s,"  if(!worker){\n   const base=new URL('./ocr-vendor/',location.href).href;", "  const language=$('ocr361-lang').value;\n  if(worker&&workerLanguage!==language){await worker.terminate();worker=null;workerLanguage='';}\n  if(!worker){\n   const base=new URL('./ocr-vendor/',location.href).href;",'OCR Sprachenwechsel')
          s=one(s,"window.Tesseract.createWorker(['deu','eng'],1,", "window.Tesseract.createWorker(language==='both'?['deu','eng']:[language],1,",'OCR ausgewählte Sprachdatei')
          s=one(s,"   });\n  }\n  return worker;", "   });\n   workerLanguage=language;\n  }\n  return worker;",'OCR Worker Sprachzustand')
          s=one(s,"script.src='./ocr360.js?v=3.6.0';", "script.src='./ocr360.js?v=3.6.1';",'OCR Cache-Fallback')
          src['ocr360.js']=s
          
          # 3. OCR resources total ~60 MB not needed during service worker installation.
          # They are fetched/cached on first OCR use, so first use must be online.
          s=src['sw.js']
          before=s.count("'./ocr-vendor/core/")
          if before!=12:raise SystemExit('Erwartet 12 OCR-Engine-Dateien, gefunden '+str(before))
          s=''.join(line for line in s.splitlines(keepends=True) if "'./ocr-vendor/core/" not in line)
          s=one(s, " './ocr-vendor/lang/deu.traineddata.gz', './ocr-vendor/lang/eng.traineddata.gz',",'', 'Sprachmodelle lazy laden')
          s=one(s,"const VERSION='3.6.0-suche-layout';", "const VERSION='3.6.1-performance-qa';",'Offline-Cacheversion')
          if re.search(r"'\./ocr-vendor/(?:core|lang)/",s):raise SystemExit('Große OCR-Dateien noch im Startcache')
          src['sw.js']=s
          
          # 4. Correct old fallback module URLs to reduce duplicate/cache-mixed loads.
          s=src['app.js']
          s=one(s,"const VERSION = '3.6.0';", "const VERSION = '3.6.1';",'Versionsnummer')
          s=one(s,"js.src='./scans352.js?v=3.5.3';", "js.src='./scans352.js?v=3.6.1';",'Scanner-Cache')
          s=one(s,"script.src='./health354.js?v=3.5.4';", "script.src='./health354.js?v=3.6.1';",'Health-Cache')
          src['app.js']=s
          src['version.json']=json.dumps({
           'version':VERSION,'released':'2026-10-30',
           'notes':'Performanceoptimierung und QA: OCR-Sprachmodelle/Engines erst bei Nutzung herunterladen (erste Texterkennung online, danach Browsercache soweit verfügbar). Voreinstellung Deutsch statt zwei OCR-Sprachen. Suchindex aus einer einzigen verschlüsselten Datenbanklesung. Abhängigkeitskritische App-Skripte weiterhin geordnet laden und Fehlerfälle protokollieren. Browser-, Navigation-, Import-, Integritäts- und Offline-Dateiprüfungen. Bestehende Patientendaten unverändert.'
          },ensure_ascii=False,indent=2)+'\n'
          for name,content in src.items():Path(name).write_text(content,encoding='utf-8')
          print('PneumoPro 3.6.1: sechs Dateien sicher optimiert. Keine Nutzerdaten verändert.')
          PYPATCH
      - name: Wiederholbare Integrations- und Browserpruefungen hinterlegen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTESTS'
          from pathlib import Path
          import base64
          files={
           'qa/pneumopro361/static_qa.py':'',
           'qa/pneumopro361/browser_qa.cjs':'',
          }
          for name,data in files.items():
           p=Path(name)
           if p.exists():raise SystemExit('Sicherheitsabbruch: '+name+' existiert bereits.')
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_bytes(base64.b64decode(data))
           print(name+': QA-Datei erstellt')
          PYTESTS
      - name: JavaScript HTML Verweise und Offline-Dateien kontrollieren
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/pneumopro361/static_qa.py
          python3 -m json.tool version.json >/dev/null
          git diff --check
      - name: App in isoliertem Mobilbrowser funktional testen
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'ERROR: Chrome/Chromium nicht vorhanden.' >&2
            exit 1
          fi
          TEST_NODE="$RUNNER_TEMP/pneumopro-361-qa"
          mkdir -p "$TEST_NODE"
          npm --prefix "$TEST_NODE" install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
          CHROME_PATH="$CHROME" NODE_PATH="$TEST_NODE/node_modules" node qa/pneumopro361/browser_qa.cjs
      - name: Verifizierte Korrekturen und QA-Tests veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secure17.js app.js sw.js search360.js ocr360.js version.json qa/pneumopro361/
          if git diff --cached --quiet; then
            echo 'Keine Änderungen notwendig.'
          else
            git commit -m 'PneumoPro 3.6.1: schnellere Suche, OCR-Speicher, gesicherter App-Start und QA'
            git push origin HEAD:main
          fi
