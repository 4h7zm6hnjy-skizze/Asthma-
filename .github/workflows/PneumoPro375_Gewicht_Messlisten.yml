name: PneumoPro 3.7.5 - Gewicht synchronisieren und Messlisten aufklappen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro375_Gewicht_Messlisten.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-375-gewicht-messlisten
  cancel-in-progress: false

jobs:
  installieren:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: App laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ein-Datei-Update installieren
        shell: bash
        run: |
          python3 - <<'PY_375'
          from pathlib import Path
          import base64, json
          
          target=Path('version.json')
          current=json.loads(target.read_text(encoding='utf-8'))
          if current.get('version') == '3.7.5':
              print('PneumoPro 3.7.5 ist bereits installiert.')
          elif current.get('version') != '3.7.4':
              raise RuntimeError('Erwartete Version 3.7.4 fehlt. Zur Sicherheit keine Aenderungen.')
          else:
              def replace_once(filename, before, after):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  count=original.count(before)
                  if count != 1:
                      raise RuntimeError(f'{filename}: erwarteter Marker nicht eindeutig: {count} Treffer.')
                  path.write_text(original.replace(before,after,1),encoding='utf-8')
              def replace_version(filename):
                  path=Path(filename)
                  original=path.read_text(encoding='utf-8')
                  if '3.7.4' not in original:
                      raise RuntimeError(f'{filename}: Version 3.7.4 fehlt.')
                  path.write_text(original.replace('3.7.4','3.7.5'),encoding='utf-8')
              if Path('tidy375.js').exists():
                  raise RuntimeError('tidy375.js existiert bereits, aber Version passt nicht.')
              Path('tidy375.js').write_bytes(base64.b64decode(''))
              replace_once('secure17.js',
                  "'lungsplit374.js'];",
                  "'lungsplit374.js','tidy375.js'];")
              replace_version('secure17.js')
              replace_version('index.html')
              replace_once('sw.js',
                  "const VERSION='3.7.4-untersuchungsarten-getrennt';",
                  "const VERSION='3.7.5-gewicht-messlisten';")
              replace_once('sw.js',
                  "'./weight292.js','./medpref25.js'",
                  "'./weight292.js','./tidy375.js','./medpref25.js'")
              replace_once('weight292.js',
                  'Alte Profilangaben werden nicht verändert.',
                  'Das neueste gespeicherte Gewicht aktualisiert automatisch das Patientenprofil, den BMI und die Körperoberfläche.')
              replace_once('weight292.js',
                  'const value={id,date,kg,note:note.slice(0,160)};',
                  'const value={id,date,kg,note:note.slice(0,160),createdAt:entries.find(x=>x.id===id)?.createdAt||new Date().toISOString()};')
              replace_once('metrics340.js',
                  "map(x=>({date:x.value.date,kg:n(x.value.kg)})).sort((a,b)=>a.date.localeCompare(b.date));",
                  "map(x=>({date:x.value.date,kg:n(x.value.kg),createdAt:String(x.value.createdAt||''),id:String(x.value.id||x.key||'')})).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)||a.id.localeCompare(b.id));")
              current['version']='3.7.5'
              current['released']='2026-10-31'
              current['notes']='Aktuellste Gewichtsmessung automatisch im Patientenprofil mit BMI und Koerperoberflaeche; Messwertlisten in bestehenden Bereichen aufklappbar (Sauerstoff, Puls, Blutdruck, Gewicht, Peak-Flow, Lungenfunktion). Bestehende Diagramme, Speicher und Daten unveraendert.'
              target.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('Update vorbereitet: Version 3.7.5; 1 neues Modul und sieben angepasste Dateien.')
          PY_375
      - name: Dateien auf Syntax, Version und Funktionen pruefen
        shell: bash
        run: |
          set -e
          node --check tidy375.js
          node --check secure17.js
          node --check weight292.js
          node --check metrics340.js
          node --check sw.js
          node --check app.js
          python3 -m json.tool version.json > /dev/null
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text())['version']=='3.7.5'
          assert "'lungsplit374.js','tidy375.js'" in Path('secure17.js').read_text()
          assert "'./weight292.js','./tidy375.js'" in Path('sw.js').read_text()
          t=Path('tidy375.js').read_text()
          for marker in ['s292-weight-list','v29-history-spo2','v29-history-bp','v29-history-pulse','epef-history','measurement-list','SEC']:
              if marker=='SEC': continue
              assert marker in t,marker
          assert '3.7.5' in Path('index.html').read_text()
          print('Alle Installations- und Syntaxkontrollen bestanden.')
          PY_CHECK
          git diff --check
      - name: Update automatisch veroeffentlichen
        shell: bash
        run: |
          set -e
          git add tidy375.js secure17.js sw.js index.html weight292.js metrics340.js version.json
          if git diff --cached --quiet; then
            echo 'Update bereits installiert.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'PneumoPro 3.7.5: Gewicht im Profil synchron und Einzelwerte aufklappbar'
            git push origin HEAD:main
          fi
