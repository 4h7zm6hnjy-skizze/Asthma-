name: PneumoPro 3.7.1 - einzelne Messwertzeilen und Prozentangaben

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro371_Gezielte_ZeilenOCR.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-371-gezielte-ocr
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lokalen Zeilenfokus installieren
        shell: bash
        run: |
          python3 - <<'PY_371'
          from pathlib import Path
          import json,base64

          def one(path,needle,replacement,label):
              p=Path(path)
              value=p.read_text(encoding='utf8')
              num=value.count(needle)
              if num!=1: raise RuntimeError(f'{label}: erwartet genau eine Stelle, gefunden {num}. Keine falschen Aenderungen anwenden.')
              p.write_text(value.replace(needle,replacement,1),encoding='utf8')

          def bump(path):
              p=Path(path)
              value=p.read_text(encoding='utf8')
              if '3.7.0' not in value:raise RuntimeError(f'{path}: Ausgangsversion 3.7.0 fehlt')
              p.write_text(value.replace('3.7.0','3.7.1'),encoding='utf8')

          state=json.loads(Path('version.json').read_text('utf8'))
          if state['version']=='3.7.1':
              print('Version 3.7.1 bereits vorhanden. Nur Check und Commit pruefen.')
          elif state['version']!='3.7.0':
              raise RuntimeError('Erwartet PneumoPro 3.7.0 als Ausgangsversion. Bitte keine fremden Dateien ueberschreiben.')
          else:
              for path in ['lungfocus371.js','lungfocus371.css']:
                  if Path(path).exists():raise RuntimeError(f'{path} existiert bereits. Keine Daten ueberschreiben.')
              Path('lungfocus371.js').write_bytes(base64.b64decode(''))
              Path('lungfocus371.css').write_bytes(base64.b64decode(''))

              # Stand der OCR-Koordinaten gesondert von der fokussierten Teilbereich-OCR aufbewahren.
              one('lungimport365.js',
                  "ocrRows366='',ocrPosition367='';",
                  "ocrRows366='',ocrPosition367='',ocrFullTSV371='',ocrFullScale371={x:1,y:1};",
                  'OCR-Vollbildkoordinaten')
              one('lungimport365.js',
                  "  ocrRows366='';ocrPosition367='';",
                  "  ocrRows366='';ocrPosition367='';ocrFullTSV371='';ocrFullScale371={x:1,y:1};",
                  'OCR-Daten zuruecksetzen')
              one('lungimport365.js',
                  "   const first=await w.recognize(c,{}, {tsv:true});",
                  "   const first=await w.recognize(c,{}, {tsv:true});\n   ocrFullTSV371=String(first.data?.tsv||'');ocrFullScale371={x:bitmap.width/c.width,y:bitmap.height/c.height};",
                  'Vollseiten-TSV fuer spaetere Zeilen-OCR erhalten')
              one('lungimport365.js',
                  "if(isPdf){ocrRows366='';ocrPosition367='';}",
                  "if(isPdf){ocrRows366='';ocrPosition367='';ocrFullTSV371='';}",
                  'PDF benoetigt keine Bildkoordinaten')

              block="  // Aus dem unveraenderten Original nur noch unsichere Zeilen/Prozentspalten\n  // mit echten Vollseiten-Wortkoordinaten fokussiert nachlesen.\n  let focus371Found=0,focus371Warnings=[];\n  if(!isPdf&&ocrFullTSV371&&window.PNEUMOPRO_FOCUS371){\n    try{\n      const study371=await window.PNEUMOPRO_FOCUS371.scan(d.blob,ocrFullTSV371,parsed.rows,ocrWorker,msg=>setStatus(msg),ocrFullScale371.x,ocrFullScale371.y);\n      const source371=new Map(parsed.rows.map(r=>[r.code,r]));\n      for(const r of study371.rows){\n        const old=source371.get(r.code);\n        if(old){\n          if(Number.isFinite(old.predicted)&&Number.isFinite(r.predicted)&&Math.abs(old.predicted-r.predicted)>.025){focus371Warnings.push(r.code+': Sollwert-Widerspruch; Original prüfen.');continue;}\n          if(Number.isFinite(old.actual)&&Number.isFinite(r.actual)&&Math.abs(old.actual-r.actual)>.025){focus371Warnings.push(r.code+': Istwert-Widerspruch; Original prüfen.');continue;}\n          if(!Number.isFinite(old.percent)&&Number.isFinite(r.percent)){\n            source371.set(r.code,{...old,percent:r.percent});focus371Found++;\n          }\n        }else if(Number.isFinite(r.actual)){\n          source371.set(r.code,r);focus371Found++;\n        }\n      }\n      if(focus371Found)parsed={...parsed,rows:[...source371.values()]};\n      focus371Warnings.push(...study371.warnings);\n      if(!study371.targets)focus371Warnings.push('Fuer fehlende Zeilen wurden keine verlaesslichen Textpositionen erkannt. Diese Angaben bleiben leer.');\n    }catch(error){focus371Warnings.push('Einzelzeilen-Nachpruefung technisch nicht moeglich: '+(error?.message||String(error))+'. Bisherige sichere Vorschlaege bleiben erhalten.');}\n  }\n"
              anchor="  if(useLines)text+='\\n\\n[Zusätzliche Tabellenzeilen aus OCR-Positionsdaten]\\n'+ocrRows366;"
              one('lungimport365.js',anchor,block+anchor,'Einzelzeilen-OCR nach bisherigen Parsern')
              one('lungimport365.js',
                  "  let notices=[...parsed.warnings];",
                  "  let notices=[...parsed.warnings,...focus371Warnings];\n  if(focus371Found)notices.push(focus371Found+' zusätzliche Angaben aus gezielt vergrößerten Tabellenzeilen als UNBESTÄTIGTE Vorschläge erkannt. Alle Werte am Original prüfen.');",
                  'Gezielte OCR-Warnungen')
              anchor=" const missing=defs[$('li365-type').value]?.filter(v=>!parsed.rows.some(x=>x.code===v[0]&&x.percent!==null&&x.percent!==undefined)).length||0;\n if(missing>0)notices.push(missing+' von '+defs[$('li365-type').value].length+' Parameterpositionen sind nicht sicher ausgelesen. Fehlende Werte bleiben leer.');"
              replace=""" const activeCodes=(defs[$('li365-type').value]||[]).map(x=>x[0]);
           const countFull371=activeCodes.filter(code=>parsed.rows.some(r=>r.code===code&&Number.isFinite(r.actual)&&Number.isFinite(r.percent))).length;
           const countPart371=activeCodes.filter(code=>parsed.rows.some(r=>r.code===code&&Number.isFinite(r.actual)&&!Number.isFinite(r.percent))).length;
           const countMissing371=activeCodes.length-countFull371-countPart371;
           if(countPart371)notices.push(countPart371+' Messwertzeile(n) TEILWEISE erkannt. Nicht lesbare Prozentwerte bleiben leer.');
           if(countMissing371)notices.push(countMissing371+' Messwertzeile(n) NICHT erkannt. Hier werden keine Zahlen ergänzt.');
          """
              one('lungimport365.js',anchor,replace,'Drei eindeutige Erkennungszustaende')
              anchor="setStatus(parsed.rows.filter(x=>x.percent!==null&&x.percent!==undefined).length+' vollstaendige und '+parsed.rows.filter(x=>x.percent===null||x.percent===undefined).length+' teilweise Messwertvorschlaege erkannt; bitte alle Zahlen am Original vergleichen. Diagramme manuell markieren.');"
              replace="setStatus(countFull371+' vollständig erkannt · '+countPart371+' teilweise erkannt · '+countMissing371+' nicht erkannt. Alle Angaben mit dem Original vergleichen; Diagramme manuell markieren.');"
              one('lungimport365.js',anchor,replace,'Erkennungsanzeige statt missverstaendlicher Gesamtzahl')

              anchor="tr.append(el('th','',label+' ('+unit+')'));let cand=parsed?.rows?.find(x=>x.code===code);"
              replace="""let cand=parsed?.rows?.find(x=>x.code===code);
            const state371=cand&&Number.isFinite(cand.actual)?(Number.isFinite(cand.percent)?'complete':'partial'):'missing';
            tr.dataset.status=state371;
            let heading371=el('th','',label+' ('+unit+')');
            heading371.append(el('small','li371-status',state371==='complete'?'Vollständig erkannt – prüfen':state371==='partial'?'Teilweise erkannt – prüfen':'Nicht erkannt'));
            tr.append(heading371);"""
              one('lungimport365.js',anchor,replace,'Status pro Zeile')
              one('secure17.js',"'lungparser370.js','lungimport365.js'","'lungparser370.js','lungfocus371.js','lungimport365.js'",'Fokus-Modul laden')
              one('sw.js',"const VERSION='3.7.0-teilwerte-ocr';","const VERSION='3.7.1-zeilen-und-prozentspalten';",'Offline-Cache')
              one('sw.js',"'./lungparser370.js',","'./lungparser370.js','./lungfocus371.js','./lungfocus371.css',",'Offline Modul und CSS')
              one('sw.js',"const important=['/lungparser370.js'","const important=['/lungfocus371.js','/lungfocus371.css','/lungparser370.js'",'Cache-Update')
              one('index.html','</head>',"<link rel=\"stylesheet\" href=\"./lungfocus371.css?v=3.7.1\"/>\n</head>",'Neues CSS laden')
              for path in ['secure17.js','index.html','app.js']:bump(path)
              state.update(version='3.7.1',released='2026-10-31',notes='Gezielter zweiter OCR-Durchgang nur auf fehlenden Lungenfunktions-Zeilen, danach bei sicherer Koordinate separate Prozentspaltenpruefung. Drei klare Status: vollstaendig, teilweise, nicht erkannt. Kein Erfinden von Werten, unveraenderte verschluesselte Originale, verpflichtende Originalkontrolle.')
              Path('version.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              print('3.7.1: Fokus-OCR und klare Vollstaendigkeitsanzeige integriert.')
          PY_371
      - name: Integration und Sicherheit pruefen
        shell: bash
        run: |
          node --check lungfocus371.js
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          node - <<'TEST371'
          const assert=require('node:assert/strict');
          global.PNEUMOPRO_PARSER369=require('./lungparser369.js');
          global.PNEUMOPRO_PARSER370=require('./lungparser370.js');
          const test=require('./lungfocus371.js');
          assert.equal(test.validated('PEF','PEF 9.50 7.60 80.0').row.actual,7.60);
          assert.equal(test.validated('PIF','PIF 6.42').row.actual,6.42);
          assert.equal(test.validated('PEF','PEF 950 7.60 80.0'),null);
          assert.equal(test.percentageFromText('80',{predicted:.4,actual:.32}),80);
          assert.equal(test.percentageFromText('800',{predicted:.4,actual:.32}),null);
          console.log('Zeilen-OCR, fehlende Dezimalpunkte und Prozent-Spalte geprueft.');
          TEST371
          python3 -c "import json; assert json.load(open('version.json'))['version']=='3.7.1'"
          git diff --check
          git add lungfocus371.js lungfocus371.css lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.7.1: OCR einzelner Messwertzeilen und Prozentspalten"
            git push origin HEAD:main
          else
            echo "3.7.1 bereits installiert."
          fi
