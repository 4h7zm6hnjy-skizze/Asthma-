name: PneumoPro 3.5.6 - Allergiewerte JSON Export Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro_JSON_Update_3.5.6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-json-356-main
  cancel-in-progress: false

jobs:
  json-allergien:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen Quellcode laden
        uses: actions/checkout@v4
      - name: JSON-Austausch installieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import base64,zlib,hashlib,json,subprocess
          
          VERSION='3.5.6'
          EXPECTED={
           "secure17.js": "83b83ffe8225b469c48a1eec6ce1a8498cbcbbd7",
           "sw.js": "e9a60282fc9391934a76aebf6ad3355bbd83ba0f",
           "app.js": "95fa1f34fb7ef80d849413ae410d66074774a3d4",
           "version.json": "b9b70ee46fc085f0c7c4954c797f521040e6d7a2"
          }
          B64_PAYLOAD=''
          EXPECTED_ADDON_SHA256='635e450f45ab40cea1c6360b0c83fab98ce3d0a57d3137510005a1cb03d0191e'
          
          
          def once(text,old,new,label):
              count=text.count(old)
              if count!=1: raise SystemExit('Sicherheitsabbruch: '+label+' nicht eindeutig ('+str(count)+').')
              return text.replace(old,new,1)
          
          release=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if release.get('version')==VERSION and Path('allergienjson356.js').exists():
              print('Version 3.5.6 bereits vorhanden – keine Änderung.')
              raise SystemExit(0)
          if release.get('version')!='3.5.5':
              raise SystemExit('Sicherheitsabbruch: Erwartet Version 3.5.5, tatsächlich '+str(release.get('version'))+'.')
          if Path('allergienjson356.js').exists():
              raise SystemExit('Sicherheitsabbruch: JSON-Modul existiert bereits. Keine Datei überschrieben.')
          if not Path('allergien355.js').is_file():
              raise SystemExit('Sicherheitsabbruch: Allergiemodul aus 3.5.5 fehlt.')
          
          source={name:Path(name).read_text(encoding='utf-8') for name in EXPECTED}
          for path,expected in EXPECTED.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=expected:
                  raise SystemExit('Sicherheitsabbruch: '+path+' wurde seit der Vorbereitung verändert. Nichts überschrieben.')
          
          changes={}
          s=source['secure17.js']
          s=once(s,"'allergien355.js','bewertung348.js'","'allergien355.js','allergienjson356.js','bewertung348.js'",'JSON-Modullader')
          s=once(s,"s.src='./'+src+'?v=3.5.5'","s.src='./'+src+'?v=3.5.6'",'JavaScript-Cache-Version')
          changes['secure17.js']=s
          s=source['sw.js']
          s=once(s,"const VERSION='3.5.5-allergien';","const VERSION='3.5.6-allergien-json';",'Offline-Cache-Version')
          s=once(s,"const ASSETS=[\n './allergien355.js'","const ASSETS=[\n './allergienjson356.js', './allergien355.js'",'Offline-Precache')
          s=once(s,"const important=['/allergien355.js'","const important=['/allergienjson356.js','/allergien355.js'",'Offline-Netzwerkstrategie')
          changes['sw.js']=s
          changes['app.js']=once(source['app.js'],"const VERSION = '3.5.5';","const VERSION = '3.5.6';",'App-Version')
          release['version']=VERSION
          release['released']='2026-10-30'
          release['notes']='Allergiebefunde als unverschlüsselte JSON-Datei für die manuelle Weitergabe (z. B. an ChatGPT) exportieren; kompatible JSON-Dateien nach Vorschau und Bestätigung verschlüsselt importieren. Dublettenabgleich und optionales Aktualisieren. Fotos und PDFs werden nicht exportiert. Bestehende Daten und Berichte bleiben erhalten.'
          changes['version.json']=json.dumps(release,ensure_ascii=False,indent=2)+'\n'
          addon=zlib.decompress(base64.b64decode(B64_PAYLOAD)).decode('utf-8')
          if hashlib.sha256(addon.encode('utf-8')).hexdigest()!=EXPECTED_ADDON_SHA256:
              raise SystemExit('Sicherheitsabbruch: JSON-Modul-Prüfsumme ungültig.')
          if 'PNEUMOPRO_ALLERGIEN_JSON356' not in addon or "SEC.put('suite'" not in addon:
              raise SystemExit('Sicherheitsabbruch: JSON-Modul unvollständig.')
          changes['allergienjson356.js']=addon
          for name,data in changes.items():Path(name).write_text(data,encoding='utf-8')
          print('PneumoPro 3.5.6: Neue JSON-Funktion eingebaut. Bestehende Daten unangetastet.')
          PYUPDATE
      - name: JavaScript, Versionsdatei und Modulverkabelung pruefen
        shell: bash
        run: |
          set -euo pipefail
          for f in allergien355.js allergienjson356.js secure17.js sw.js app.js suite15.js statsplus292.js; do node --check "$f"; done
          python3 -m json.tool version.json >/dev/null
          git diff --check
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import json
          assert json.loads(Path('version.json').read_text())['version']=='3.5.6'
          assert "'allergien355.js','allergienjson356.js'" in Path('secure17.js').read_text()
          assert "'./allergienjson356.js'" in Path('sw.js').read_text()
          assert 'PNEUMOPRO_ALLERGIEN_JSON356' in Path('allergienjson356.js').read_text()
          assert 'PneumoPro-Allergien-JSON' in Path('allergienjson356.js').read_text()
          print('Technische Pruefung erfolgreich')
          PYVERIFY
      - name: Version 3.5.6 veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allergienjson356.js secure17.js sw.js app.js version.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen erforderlich"
          else
            git commit -m "PneumoPro 3.5.6: Allergiewerte JSON importieren exportieren"
            git push origin HEAD:main
          fi
