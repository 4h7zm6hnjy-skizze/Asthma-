name: PneumoPro 3.6.6 - Lungenfunktion Tabellen erkennen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro366_Tabellenerkennung.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-366-tabellen
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bestehenden Scanner sicher aktualisieren
        shell: bash
        run: |
          python3 - <<'PY_366'
          from pathlib import Path
          import base64, json, subprocess
          
          expected={'lungimport365.js': [('async function recognizeImage(blob)',1),('currentDoc=d;parsed=parse(text);',1)], 'lungimport365.css':[('#li365 .li365-fields',1)]}
          for filename,needles in expected.items():
              source=Path(filename).read_text(encoding='utf-8')
              for needle,_ in needles:
                  if needle not in source: raise RuntimeError(f'Originalstruktur von {filename} hat sich geaendert ({needle}). Update nicht angewandt.')
          
          b64={
           'lungparser366.js':'',
           'lungimport365.js':'',
           'lungimport365.css':''
          }
          for p,value in b64.items():Path(p).write_bytes(base64.b64decode(value))
          
          def one(path,a,b):
              x=Path(path).read_text(encoding='utf-8')
              if x.count(a)!=1:raise RuntimeError(f'{path}: Unerwartete Version, Update nicht moeglich: {a}')
              Path(path).write_text(x.replace(a,b,1),encoding='utf-8')
          
          one('secure17.js',"'doccopy363.js','lungimport365.js'", "'doccopy363.js','lungparser366.js','lungimport365.js'")
          one('secure17.js',"s.src='./'+src+'?v=3.6.5'", "s.src='./'+src+'?v=3.6.6'")
          one('app.js',"const VERSION = '3.6.5';", "const VERSION = '3.6.6';")
          one('sw.js',"const VERSION='3.6.5-offline-lungenerkennung';", "const VERSION='3.6.6-tabellenerkennung';")
          one('sw.js',"const ASSETS=[", "const ASSETS=[\n './lungparser366.js',")
          one('sw.js',"const important=[", "const important=['/lungparser366.js',")
          html=Path('index.html').read_text(encoding='utf-8')
          if html.count('3.6.5')<8 or html.count('</head>')!=1:raise RuntimeError('Unerwartete HTML-Version')
          html=html.replace('3.6.5','3.6.6')
          Path('index.html').write_text(html,encoding='utf-8')
          info=json.loads(Path('version.json').read_text(encoding='utf-8'))
          if info['version']!='3.6.5':raise RuntimeError('Die aktuelle Version ist nicht 3.6.5 – Update abgebrochen')
          info.update(version='3.6.6',released='2026-10-31',notes='Verbesserte Erkennung von Soll/Ist/%-Tabellen mit zusaetzlichen Klinikspalten, Referenzwerten und Z-Scores. Zweiter lokaler OCR-Versuch bei erfolglosem Foto. Messwerte nur als Vorschlaege, manuelle Kontrolle zwingend, Warnung bei Unsicherheit und Option ChatGPT. Mobilformulare sauber untereinander, Originaldaten bleiben verschluesselt.')
          Path('version.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for p in ['lungparser366.js','lungimport365.js','app.js','secure17.js','sw.js']:
              subprocess.run(['node','--check',p],check=True)
          assert json.loads(Path('version.json').read_text())['version']=='3.6.6'
          assert "'lungparser366.js','lungimport365.js'" in Path('secure17.js').read_text()
          print('3.6.6 erfolgreich vorbereitet; keinerlei medizinische Privatdateien in GitHub')
          PY_366
      - name: Parser mit echten Tabellenformaten pruefen
        shell: bash
        run: |
          node - <<'NODE_366'
          const assert=require('node:assert/strict');
          const {parse}=require('./lungparser366.js');
          const tests=[
            ['FEV1 5.13 3.69 72.0 -2.21\nFVC 6.45 4.50 69.8 -2.47',2],
            ['FEV1 5.13 4.01 3.69 72.0 -2.21\nFVC 6.45 4.55 4.50 69.8 -2.47',2],
            ['DLCO SB 12.90 9.88 77\nKCO SB 1.55 1.85 120',2],
            ['FEV1 5.13 2.1 90\nFVC 6.45 4.50 15',0]
          ];
          for(const [v,n] of tests)assert.equal(parse('28.10.2026\n'+v).rows.length,n,'Sichere Zuordnung fehlgeschlagen');
          console.log('Parser-Pruefungen bestanden');
          NODE_366
      - name: Installieren und committen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lungparser366.js lungimport365.js lungimport365.css secure17.js sw.js app.js index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m 'PneumoPro 3.6.6: OCR Tabellen mit Zusatzspalten und iPhone-Layout'
          git pull --rebase origin main
          git push origin HEAD:main
