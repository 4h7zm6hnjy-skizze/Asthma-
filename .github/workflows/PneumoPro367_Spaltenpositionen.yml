name: PneumoPro 3.6.7 - OCR-Spaltenpositionen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro367_Spaltenpositionen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-367-positionen
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parser mit OCR-Spaltenpositionen einbauen
        shell: bash
        run: |
          if grep -q '"version": "3.6.7"' version.json; then
            echo "Version 3.6.7 ist bereits vorhanden."
          else
            python3 - <<'PY_PNEUMO367'
            from pathlib import Path
            import base64,json,subprocess

            def one(p,old,new,label):
             s=Path(p).read_text(encoding='utf-8')
             if s.count(old)!=1:
              raise RuntimeError(f'{label}: Stelle nicht eindeutig (Treffer={s.count(old)}). Keine Aenderung gespeichert.')
             Path(p).write_text(s.replace(old,new,1),encoding='utf-8')

            def allv(p):
             s=Path(p).read_text(encoding='utf-8')
             if '3.6.6' not in s: raise RuntimeError(f'{p}: Ausgangsversion 3.6.6 nicht gefunden')
             Path(p).write_text(s.replace('3.6.6','3.6.7'),encoding='utf-8')

            assert not Path('lungparser367.js').exists(), 'Neues Modul existiert bereits: Update bitte pruefen'
            Path('lungparser367.js').write_bytes(base64.b64decode(''))

            # Nur die Erkennung erweitern; bestaetigte Befunde, Tresor und Speichern unveraendert lassen.
            one('lungimport365.js',",ocrRows366='';",",ocrRows366='',ocrPosition367='';",'Zustand der OCR-Positionen')
            one('lungimport365.js',"  ocrRows366='';\n  const bitmap=", "  ocrRows366='';ocrPosition367='';\n  const bitmap=",'OCR-Zustand zuruecksetzen')
            one('lungimport365.js',"const best=byRows?.rows?.length>normal?.rows?.length?byRows:normal;\n     return {text,tsv,rowsText,score:best?.rows?.length||0};", "const best=byRows?.rows?.length>normal?.rows?.length?byRows:normal;\n     const spatial=window.PNEUMOPRO_PARSER367?.parseTSV(tsv,text);\n     return {text,tsv,rowsText,score:Math.max(best?.rows?.length||0,spatial?.rows?.length||0)};",'Bildspalten in OCR-Bewertung')
            one('lungimport365.js',"   ocrRows366=best.rowsText;", "   ocrRows366=best.rowsText;ocrPosition367=best.tsv;",'Koordinaten nach OCR merken')
            one('lungimport365.js',"if(isPdf)ocrRows366='';", "if(isPdf){ocrRows366='';ocrPosition367='';}",'PDF-Zustand zuruecksetzen')
            one('lungimport365.js',"  parsed=useLines?{...fromLines,date:fromLines.date||fromText.date,warnings:[...new Set([...fromLines.warnings,...fromText.warnings])]}:fromText;\n  if(useLines)", "  parsed=useLines?{...fromLines,date:fromLines.date||fromText.date,warnings:[...new Set([...fromLines.warnings,...fromText.warnings])]}:fromText;\n  const geo=!isPdf&&ocrPosition367?window.PNEUMOPRO_PARSER367?.parseTSV(ocrPosition367,text):null;\n  const useGeo=geo&&geo.rows.length>parsed.rows.length;\n  if(useGeo)parsed={...geo,date:geo.date||parsed.date||fromText.date,warnings:geo.warnings};\n  else if(geo?.diagnostics?.recognized&&!parsed.rows.length)parsed.warnings=[...new Set([...parsed.warnings,...geo.warnings])];\n  if(useLines)",'Raeumliche Spaltenauswertung priorisieren')
            one('lungimport365.js',"  if(useLines)notices.push('Tabellenzeilen anhand ihrer Bildposition rekonstruiert. Bitte Zuordnung der Zahlen am Original besonders sorgfältig prüfen.');", "  if(useLines&&!useGeo)notices.push('Tabellenzeilen anhand ihrer Bildposition rekonstruiert. Bitte Zuordnung der Zahlen am Original besonders sorgfältig prüfen.');\n  if(useGeo)notices.push('Soll/Ist/% anhand wiederkehrender echter Spaltenpositionen als UNBESTAETIGTE Vorschlaege erkannt. Jede Zahl, Einheit und Messphase am Original pruefen.');",'Warnung zum OCR-Spaltenabgleich')

            one('secure17.js',"'lungparser366.js','lungimport365.js'", "'lungparser366.js','lungparser367.js','lungimport365.js'",'Neuen Parser vor Importmodul laden')
            allv('secure17.js')
            one('sw.js',"const VERSION='3.6.6-tabellenerkennung';", "const VERSION='3.6.7-positionsdaten';",'Offline-Cache erneuern')
            one('sw.js'," './lungparser366.js',", " './lungparser366.js','./lungparser367.js',",'Neuen Parser offline vorladen')
            one('sw.js',"const important=['/lungparser366.js'", "const important=['/lungparser367.js','/lungparser366.js'",'Neuen Parser frisch laden')
            allv('index.html');allv('app.js')
            notes=('OCR-Tabellen anhand echter Spaltenpositionen mit rechnerischer Plausibilitaetspruefung. '
                   'Nur wiederholt eindeutig passende Soll/Ist/%-Spalten als unbestaetigte Vorschlaege; '
                   'unklare Werte bleiben leer und erzeugen Warnungen. '
                   'Originale und Tresor unveraendert, kein Upload medizinischer Daten. '
                   'Auch mit dieser Version ist eine 100-prozentige Erkennung nicht garantiert.')
            meta=json.loads(Path('version.json').read_text(encoding='utf-8'))
            if meta['version']!='3.6.6':raise RuntimeError('Es wird Version 3.6.6 als Ausgangsbasis erwartet.')
            meta.update(version='3.6.7',released='2026-10-31',notes=notes)
            Path('version.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

            for p in ['lungparser367.js','lungimport365.js','secure17.js','app.js']:
             subprocess.run(['node','--check',p],check=True)
            assert 'lungparser367.js' in Path('sw.js').read_text()
            assert "'lungparser366.js','lungparser367.js','lungimport365.js'" in Path('secure17.js').read_text()
            assert json.loads(Path('version.json').read_text())['version']=='3.6.7'
            print('PneumoPro 3.6.7: Quellcode-Pruefungen bestanden.')
            PY_PNEUMO367
          fi
      - name: Quellcode, Versionsdatei und Commit pruefen
        shell: bash
        run: |
          node --check lungparser367.js
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          python3 -c "import json; assert json.load(open('version.json'))['version']=='3.6.7'"
          git diff --check
          git add lungparser367.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.6.7: OCR-Spaltenpositionen statt nur Textreihenfolge"
            git push origin HEAD:main
          else
            echo "Keine weiteren Aenderungen erforderlich."
          fi
