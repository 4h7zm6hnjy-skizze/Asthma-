name: PneumoPro 3.6.0 - Suche Logo und lokale Texterkennung

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro_Suche_OCR_3.6.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-suche-ocr360-main
  cancel-in-progress: false

jobs:
  app-und-texterkennung:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuelle PneumoPro-Dateien laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Kopfzeile Suchfunktion und OCR aktivieren
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import base64
          import json
          import subprocess
          
          VERSION = '3.6.0'
          PREVIOUS = '3.5.9'
          EXPECTED = {
              'secure17.js': '393fe588cd3ea553afa1ea748c0c5392ef76d72c',
              'app.js': 'e0aec49fc76d57bca14c52902423ed36f5a9a296',
              'sw.js': 'b04f4c57f1b49639ceb1e4692977c64663436674',
              'version.json': '3b224d70cbbb0603432ded927942f1402ebb30d8',
              'hub20.js': '3b9a8152d3117fc85f372efd126c3ca7699dc943',
          }
          for name, expected in EXPECTED.items():
              actual = subprocess.check_output(['git','hash-object',name],text=True).strip()
              if actual != expected:
                  raise SystemExit('Sicherheitsabbruch: '+name+' wurde seit der Vorbereitung verändert. Bitte keine Dateien überschreiben.')
          
          if Path('search360.js').exists() or Path('ocr360.js').exists() or Path('ocr-vendor').exists():
              raise SystemExit('Sicherheitsabbruch: Such-/OCR-Dateien existieren bereits; keine Dateien überschreiben.')
          
          def replace_once(source, old, new, purpose):
              count = source.count(old)
              if count != 1:
                  raise SystemExit('Sicherheitsabbruch: '+purpose+' nicht eindeutig (gefunden '+str(count)+').')
              return source.replace(old,new,1)
          
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          if version.get('version') != PREVIOUS:
              raise SystemExit('Erwartet '+PREVIOUS+', vorhanden '+str(version.get('version'))+'. Keine Dateien verändert.')
          
          source = {name:Path(name).read_text(encoding='utf-8') for name in EXPECTED}
          source['secure17.js'] = replace_once(source['secure17.js'], "'jsoncenter358.js','bewertung348.js'", "'jsoncenter358.js','bewertung348.js','search360.js','ocr360.js'", 'Suchmodul laden')
          source['secure17.js'] = replace_once(source['secure17.js'], "s.src='./'+src+'?v=3.5.9'", "s.src='./'+src+'?v=3.6.0'", 'Modul-Cacheversion')
          source['app.js'] = replace_once(source['app.js'], "const VERSION = '3.5.9';", "const VERSION = '3.6.0';", 'Appversion')
          source['sw.js'] = replace_once(source['sw.js'], "const VERSION='3.5.9-json-sichtbar';", "const VERSION='3.6.0-suche-layout';", 'Offline-Cacheversion')
          source['sw.js'] = replace_once(source['sw.js'], "const ASSETS=[\n './jsoncenter358.js'", "const ASSETS=[\n './search360.js', './ocr360.js', './ocr-vendor/tesseract.min.js', './ocr-vendor/worker.min.js', './ocr-vendor/pdf.min.mjs', './ocr-vendor/pdf.worker.min.mjs', './ocr-vendor/lang/deu.traineddata.gz', './ocr-vendor/lang/eng.traineddata.gz', './jsoncenter358.js'", 'Offline-Dateien')
          source['sw.js'] = replace_once(source['sw.js'], "const important=['/jsoncenter358.js'", "const important=['/search360.js','/ocr360.js','/jsoncenter358.js'", 'Online-Cacheaktualisierung')
          source['version.json'] = json.dumps({
            'version':'3.6.0', 'released':'2026-10-30',
            'notes':'iPhone-Kopfzeile mit vollständigem PneumoPro-Logo und komplett sichtbarem Suchfenster. Suche in allen lokal gespeicherten Daten inklusive geprüfter OCR-Texte aus Foto/PDF. Offline-Texterkennung mit lokalen deutschen und englischen Sprachmodellen, PDF-Textauslesung und OCR für Scan-PDFs (bis 5 Seiten). Text vor verschlüsselter Speicherung prüfen; keine automatische Diagnose oder Messwertübernahme. Gesundheitsdaten bleiben unangetastet.'
          },ensure_ascii=False,indent=2)+'\n'
          
          
          source['hub20.js'] = replace_once(source['hub20.js'],
              "async function search(){const q=input.value.trim().toLocaleLowerCase('de-DE');",
              "async function search(){if(window.PNEUMOPRO_SEARCH360)return;const q=input.value.trim().toLocaleLowerCase('de-DE');",
              'Alte Suchfunktion nach Aktivierung der neuen Suche deaktivieren')
          
          SEARCH_SOURCE = ''
          OCR_SOURCE = ''
          source['search360.js']=base64.b64decode(SEARCH_SOURCE).decode('utf-8')
          source['ocr360.js']=base64.b64decode(OCR_SOURCE).decode('utf-8')
          for name,value in source.items():
              Path(name).write_text(value,encoding='utf-8')
          print('PneumoPro 3.6.0: lokale Suche, Logo, OCR und Vorbereitungen installiert. Keine privaten Daten verändert.')
          PYUPDATE
      - name: OCR-Bibliotheken und Sprachmodelle lokal einbauen
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pneumopro-ocr" --no-save --ignore-scripts --no-audit --no-fund --silent \
            'tesseract.js@7.0.0' 'tesseract.js-core@7.0.0' 'pdfjs-dist@5.4.624'
          SRC="$RUNNER_TEMP/pneumopro-ocr/node_modules"
          mkdir -p ocr-vendor/core ocr-vendor/lang
          cp "$SRC/tesseract.js/dist/tesseract.min.js" ocr-vendor/tesseract.min.js
          cp "$SRC/tesseract.js/dist/worker.min.js" ocr-vendor/worker.min.js
          cp "$SRC/pdfjs-dist/build/pdf.min.mjs" ocr-vendor/pdf.min.mjs
          cp "$SRC/pdfjs-dist/build/pdf.worker.min.mjs" ocr-vendor/pdf.worker.min.mjs
          find "$SRC/tesseract.js-core" -maxdepth 1 -type f -name 'tesseract-core*.wasm*' -exec cp {} ocr-vendor/core/ \;
          test "$(find ocr-vendor/core -type f -name '*.wasm.js' | wc -l)" -ge 4
          test "$(find ocr-vendor/core -type f -name '*.wasm' | wc -l)" -ge 4
          for lang in deu eng; do
            curl --fail --location --show-error --silent --retry 3 \
              --connect-timeout 20 "https://tessdata.projectnaptha.com/4.0.0/${lang}.traineddata.gz" \
              --output "ocr-vendor/lang/${lang}.traineddata.gz"
            gzip -t "ocr-vendor/lang/${lang}.traineddata.gz"
            test "$(stat -c %s "ocr-vendor/lang/${lang}.traineddata.gz")" -gt 50000
          done
          cp "$SRC/tesseract.js/LICENSE.md" ocr-vendor/TESSERACT_LICENSE.md 2>/dev/null || \
            cp "$SRC/tesseract.js/LICENSE" ocr-vendor/TESSERACT_LICENSE
          cp "$SRC/pdfjs-dist/LICENSE" ocr-vendor/PDFJS_LICENSE 2>/dev/null || \
            cp "$SRC/pdfjs-dist/LICENSE.md" ocr-vendor/PDFJS_LICENSE.md
          python3 - <<'PYCACHE'
          from pathlib import Path
          files=sorted(str(x).replace('\\','/') for x in Path('ocr-vendor/core').glob('*.wasm*'))
          if len(files)<8:raise RuntimeError('Zu wenige OCR-Engine-Dateien; Abbruch')
          source=Path('sw.js').read_text(encoding='utf-8')
          mark='const ASSETS=[\n'
          assert source.count(mark)==1
          source=source.replace(mark,mark+''.join(" './"+x+"',\n" for x in files),1)
          Path('sw.js').write_text(source,encoding='utf-8')
          print('Offline-OCR-Bibliotheken und Engine-Dateien: '+str(len(files)))
          PYCACHE
      - name: Syntax und Funktionsintegration prüfen
        shell: bash
        run: |
          set -euo pipefail
          for script in search360.js ocr360.js secure17.js app.js sw.js hub20.js ocr-vendor/tesseract.min.js ocr-vendor/worker.min.js; do node --check "$script"; done
          node --check ocr-vendor/pdf.min.mjs
          node --check ocr-vendor/pdf.worker.min.mjs
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PYCHECK'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text())['version']=='3.6.0'
          search=Path('search360.js').read_text()
          ocr=Path('ocr360.js').read_text()
          secure=Path('secure17.js').read_text()
          sw=Path('sw.js').read_text()
          assert "const panel=$('nav317-search-panel')" in search
          assert "['documents','Dokumente & Scans'" in search
          assert 'ocrText' in ocr and "S.put('documents'" in ocr
          assert "'search360.js','ocr360.js'" in secure
          assert "'./ocr360.js'" in sw and "'./search360.js'" in sw
          assert 'PNEUMOPRO_SEARCH360' in Path('hub20.js').read_text()
          assert len(list(Path('ocr-vendor/core').glob('*.wasm')))>=4
          assert (Path('ocr-vendor/lang/deu.traineddata.gz')).stat().st_size>50000
          print('Integration von OCR, verschlüsselter Speicherung, Suche und Offline-Ladepfad geprüft.')
          PYCHECK
          git diff --check
      - name: Version 3.6.0 samt Offline-OCR veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search360.js ocr360.js ocr-vendor secure17.js app.js sw.js version.json hub20.js
          if git diff --cached --quiet; then
            echo 'Keine Änderungen erforderlich'
          else
            git commit -m 'PneumoPro 3.6.0: lokales OCR, Volltextsuche und Logo sichtbar'
            git push origin HEAD:main
          fi
