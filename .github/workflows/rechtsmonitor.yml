
name: Amtliche Rechtsupdates sammeln

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  rechtsmonitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Amtliche Nachrichten abrufen
        run: python build_rechtsmonitor_feed.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rechtsmonitor-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update amtliche Rechtsmeldungen"
            git push
          fi
