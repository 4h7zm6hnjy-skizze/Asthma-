name: PneumoPro 3.7.4 - Untersuchungsarten getrennt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro374_Untersuchungsarten.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-374-untersuchungsarten
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuellen App-Stand laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Getrennte Untersuchungsansichten installieren
        shell: bash
        run: |
          python3 - <<'PY_374'
          from pathlib import Path
          import base64,json,subprocess
          
          vfile=Path('version.json')
          meta=json.loads(vfile.read_text(encoding='utf-8'))
          if meta.get('version')=='3.7.4':
           print('Version 3.7.4 ist bereits vorhanden, keine doppelten Aenderungen.')
          elif meta.get('version')!='3.7.3':
           raise SystemExit('Ausgangsversion 3.7.3 erwartet; aus Sicherheitsgruenden nichts aendern.')
          else:
           def one(filename,old,new):
            f=Path(filename);source=f.read_text(encoding='utf-8')
            if source.count(old)!=1:raise RuntimeError(f'{filename}: Marker nicht eindeutig ({source.count(old)} Treffer).')
            f.write_text(source.replace(old,new,1),encoding='utf-8')
           def allv(filename):
            f=Path(filename);source=f.read_text(encoding='utf-8')
            if '3.7.3' not in source:raise RuntimeError(f'{filename}: Version 3.7.3 fehlt.')
            f.write_text(source.replace('3.7.3','3.7.4'),encoding='utf-8')
           if Path('lungsplit374.js').exists():raise RuntimeError('Modul bereits vorhanden bei falscher Version.')
           Path('lungsplit374.js').write_bytes(base64.b64decode(''))
           one('lungimport365.js',"measurements:[['sR_eff'", "measurements:[['VC','VC','l'],['FVCin','FVC in','l'],['FVCEx','FVC ex','l'],['FEV1_VC','FEV1/VC','%'],['MEF25','MEF25','l/s'],['MEF50','MEF50','l/s'],['MEF75','MEF75','l/s'],['Rawtot','Rawtot','kPa/(l/s)'],['sRawtot','sRawtot','kPa·s'],['Rawin','Rawin','kPa/(l/s)'],['Rawex','Rawex','kPa/(l/s)'],['TGV','TGV','l'],['sR_eff'")
           one('lungimport365.js'," const patterns=[\n", " const patterns=[\n [/^FVC\\s*(?:in|inspiratorisch)\\b/i,'FVCin'],[/^FVC\\s*(?:ex|exspiratorisch)\\b/i,'FVCEx'],[/^FEV\\s*1\\s*\\/\\s*VC\\b/i,'FEV1_VC'],[/^MEF\\s*25\\b/i,'MEF25'],[/^MEF\\s*50\\b/i,'MEF50'],[/^MEF\\s*75\\b/i,'MEF75'],[/^Rawtot\\b/i,'Rawtot'],[/^sRawtot\\b/i,'sRawtot'],[/^Rawin\\b/i,'Rawin'],[/^Rawex\\b/i,'Rawex'],[/^TGV\\b/i,'TGV'],[/^VC\\b/i,'VC'],\n")
           one('lungimport365.js',"const at=code=>rows.find(x=>x.code===code);Object.assign(value,{fev1:at('FEV1').percent,fvc:at('FVC').percent,fev1Liters:at('FEV1').actual,fvcLiters:at('FVC').actual,ratio:at('FEV1_FVC').actual});", "const at=code=>rows.find(x=>x.code===code)||{};const fvc=rows.find(x=>['FVC','FVCEx','FVCin'].includes(x.code)&&x.actual!==null)||{};Object.assign(value,{fev1:at('FEV1').percent??null,fvc:fvc.percent??null,fev1Liters:at('FEV1').actual??null,fvcLiters:fvc.actual??null,ratio:at('FEV1_FVC').actual??at('FEV1_VC').actual??null});")
           one('secure17.js',"'lungreview373.js','lungimport365.js'", "'lungreview373.js','lungimport365.js','lungsplit374.js'")
           one('sw.js',"const VERSION='3.7.3-ursprungsbild-pruefung';", "const VERSION='3.7.4-untersuchungsarten-getrennt';")
           one('sw.js'," './lungimport365.js','./lungimport365.css',", " './lungimport365.js','./lungsplit374.js','./lungimport365.css',")
           one('sw.js',"const important=['/lungreview373.js'", "const important=['/lungsplit374.js','/lungreview373.js'")
           for filename in ('secure17.js','app.js','index.html'):allv(filename)
           meta.update(version='3.7.4',released='2026-10-31',notes='Getrennte Pruefansichten fuer Spirometrie, Bodyplethysmographie und Diffusionsmessung bei einem zentralen Original-Upload. Zusaetzliche Messparameter fuer Hausarzt-Befunde, unveraenderte lokale Verschluesselung und vorhandene Diagramme. Spirometrie und Body in einem Messwertdatensatz, Diffusion separat; unlesbare Werte bleiben leer und werden geprueft.')
           vfile.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
           for file in ('lungsplit374.js','lungimport365.js','secure17.js','app.js'):
            subprocess.run(['node','--check',file],check=True)
           assert 'lungsplit374.js' in Path('sw.js').read_text(encoding='utf-8')
           assert 'lungsplit374.js' in Path('secure17.js').read_text(encoding='utf-8')
           assert json.loads(Path('version.json').read_text(encoding='utf-8'))['version']=='3.7.4'
           print('Syntax- und Versionspruefungen erfolgreich.')
          PY_374
      - name: Pruefen und App-Dateien uebernehmen
        shell: bash
        run: |
          node --check lungsplit374.js
          node --check lungimport365.js
          node --check secure17.js
          python3 -c "import json; assert json.load(open('version.json'))['version']=='3.7.4'"
          git diff --check
          git add lungsplit374.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.7.4: getrennte Spirometrie-, Body- und Diffusionspruefung"
            git push origin HEAD:main
          else
            echo "PneumoPro 3.7.4 bereits installiert"
          fi
