name: PneumoPro 3.7.3 - Originalbild und Messwerte kontrollieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro373_Originalkontrolle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-373-originalpruefung
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nachpruefansicht im Browser installieren
        shell: bash
        run: |
          python3 - <<'PY_373'
          from pathlib import Path
          import base64,json,subprocess
          
          vfile=Path('version.json')
          meta=json.loads(vfile.read_text(encoding='utf-8'))
          if meta.get('version')=='3.7.3':
           print('PneumoPro 3.7.3 ist bereits installiert; keine erneuten Aenderungen.')
          elif meta.get('version')!='3.7.2':
           raise SystemExit('Erwartete Ausgangsversion 3.7.2 nicht vorhanden. Nichts veraendert.')
          else:
           def one(file,old,new):
            path=Path(file);txt=path.read_text(encoding='utf-8');hits=txt.count(old)
            if hits!=1:raise RuntimeError(file+': Marker nicht eindeutig, Treffer '+str(hits)+'. Nichts weiter verarbeiten.')
            path.write_text(txt.replace(old,new,1),encoding='utf-8')
           def allv(file):
            p=Path(file);s=p.read_text(encoding='utf-8')
            if '3.7.2' not in s:raise RuntimeError('Version 3.7.2 in '+file+' nicht gefunden.')
            p.write_text(s.replace('3.7.2','3.7.3'),encoding='utf-8')
           if Path('lungreview373.js').exists():raise RuntimeError('Review-Modul existiert bereits; keine doppelte Installation.')
           Path('lungreview373.js').write_bytes(base64.b64decode(''))
           one('lungimport365.js','async function setCurrentDoc(d){currentDoc=d;parsed=null;','async function setCurrentDoc(d){window.PNEUMOPRO_REVIEW373?.reset?.();currentDoc=d;parsed=null;')
           one('lungimport365.js',"drawRows();$('li365-review').hidden=false;","drawRows();$('li365-review').hidden=false;window.PNEUMOPRO_REVIEW373?.attach(d.blob);")
           one('lungimport365.js',"note:'Lokal aus Originaldokument übernommen, vollständig vom Nutzer geprüft. Nicht erkannte Felder bleiben leer.'","note:'Lokal aus Originaldokument uebernommen und vom Nutzer am Original geprueft; nicht erkannte Felder bleiben leer.'")
           one('lungimport365.js','rows.push(data);',"data.sourceStatus=tr.dataset.status||'unknown';rows.push(data);")
           one('secure17.js',"'lungfocus372.js','lungimport365.js'","'lungfocus372.js','lungreview373.js','lungimport365.js'")
           one('sw.js',"const VERSION='3.7.2-tabelle-bildposition';","const VERSION='3.7.3-ursprungsbild-pruefung';")
           one('sw.js'," './lungimport365.js','./lungimport365.css',"," './lungreview373.js',\n './lungimport365.js','./lungimport365.css',")
           one('sw.js',"const important=['/lungfocus372.js'","const important=['/lungreview373.js','/lungfocus372.js'")
           for filename in ('secure17.js','app.js','index.html'):allv(filename)
           meta.update(version='3.7.3',released='2026-10-31',notes='Neue lokale Originalbild-Nachpruefansicht fuer teilweise oder nicht erkannte Lungenfunktionswerte: Bildzoom, zeilenweise Eingabe, bewusste Originalkontrolle, Plausibilitaetspruefung und Kennzeichnung manuell abgeglichener Werte. Vorhandene OCR bleibt konservativ; keine geschaetzten Messwerte oder Bearbeitung gespeicherter Fotos. Endgueltige Speicherung erst nach bestehender Bestaetigung.')
           vfile.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
           for f in ('lungreview373.js','lungimport365.js','secure17.js','app.js'):
            subprocess.run(['node','--check',f],check=True)
           assert 'lungreview373.js' in Path('sw.js').read_text()
           assert "'lungfocus372.js','lungreview373.js','lungimport365.js'" in Path('secure17.js').read_text()
           print('PneumoPro 3.7.3: Syntax und Installationsmarker erfolgreich geprueft.')
          PY_373
      - name: Code pruefen und Aenderungen uebernehmen
        shell: bash
        run: |
          node --check lungreview373.js
          node --check lungimport365.js
          node --check secure17.js
          python3 -c "import json; assert json.load(open('version.json'))['version']=='3.7.3'"
          git diff --check
          git add lungreview373.js lungimport365.js secure17.js sw.js index.html app.js version.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "PneumoPro 3.7.3: Originalbild-Zoom und kontrollierte manuelle OCR-Ergaenzung"
            git push origin HEAD:main
          else
            echo "Version 3.7.3 bereits im Repository"
          fi
