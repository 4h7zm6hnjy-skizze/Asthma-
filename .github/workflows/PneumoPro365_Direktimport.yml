              s=one(s,"const VERSION='3.6.4-lesbare-diagramme';","const VERSION='3.6.5-offline-lungenerkennung';",'Offline-Cache')
              s=one(s,'const ASSETS=[',"const ASSETS=[\n './lungimport365.js','./lungimport365.css',",'Offline-Assets')
              return one(s,'const important=[',"const important=['/lungimport365.js','/lungimport365.css',",'Neue Module im Cache')
          edit('sw.js',sw)

          def html(s):
              if '3.6.4' not in s: raise RuntimeError('index.html: Version 3.6.4 nicht gefunden.')
              s=one(s,'</head>','<link rel="stylesheet" href="./lungimport365.css?v=3.6.5"/>\n</head>','CSS-Integration')
              return s.replace('3.6.4','3.6.5')
          edit('index.html',html)

          def manifest(s):
              meta=json.loads(s)
              if meta.get('version')!='3.6.4':raise RuntimeError('Manifest passt nicht zur bestehenden Version.')
              meta.update(version='3.6.5',released='2026-10-31',notes='Neuer Lungenfunktionstest als Foto, HEIC, PNG oder PDF direkt in PneumoPro prüfen. Lokale Texterkennung und vorsichtige Soll-Ist-Prozent-Prüfung; nur überprüfte Messwerte werden nach ausdrücklicher Bestätigung gespeichert. Erkennungsvorschläge und manuelle Originaldiagramm-Ausschnitte werden pro Test mit verschlüsseltem Original verknüpft. Bei fehlender oder unklarer Zuordnung erscheint eine ausdrückliche Warnung mit Option zur eigenen ChatGPT-Nachprüfung. Keine automatische Weitergabe privater Befunde. Bestehende Daten bleiben unverändert.')
              return json.dumps(meta,ensure_ascii=False,indent=2)+'\n'
          edit('version.json',manifest)

          assert "'doccopy363.js','lungimport365.js'" in Path('secure17.js').read_text(encoding='utf-8')
          assert 'lungimport365.css?v=3.6.5' in Path('index.html').read_text(encoding='utf-8')
          print('Alle Module vorbereitet, vorhandene Akten und Originale bleiben unangetastet.')
          PY_INSTALL
      - name: JavaScript, Parser und Datenstruktur prüfen
        shell: bash
        run: |
          set -e
          node --check lungimport365.js
          node --check secure17.js
          node --check app.js
          node --check sw.js
          python3 -m json.tool version.json >/dev/null
          node - <<'NODE_TEST'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('lungimport365.js','utf8');
          const sandbox={window:{ASTHMA_SECURITY:{state:()=>({unlocked:true})}},document:{getElementById:id=>id==='li365'?null:{}},module:{exports:{}}};
          vm.runInNewContext(src,sandbox);const parser=sandbox.module.exports.parse;
          assert.equal(typeof parser,'function');
          const a=parser('Untersuchung 28.10.2026\nSoll Ist %Soll Z\nFEV1 5,13 3,69 72 -1,9\nFVC 6,45 4,50 69,8 -2,1');
          assert.equal(a.date,'2026-10-28');assert.equal(a.kind,'measurements');assert.equal(a.rows.length,2);
          const b=parser('Untersuchung 28.10.2026\nSoll Ist %Soll Z\nDLCO_SB 12,83 9,88 77 -1,8\nKCO_SB 1,54 1,85 120 0,8');
          assert.equal(b.kind,'diffusion');assert.equal(b.rows.length,2);
          const invalid=parser('Soll Ist %Soll\nFEV1 4,2 3,0 64,3');
          assert.equal(invalid.rows.length,0);assert.ok(invalid.warnings.length>0);
          const ambiguous=parser('Soll Ist %Soll\nFEV1 4,2 3,0 71,4 1,2 0,8');
          assert.equal(ambiguous.rows.length,0);assert.ok(ambiguous.warnings.length>0);
          console.log('Parser und Warnungen: alle Tests bestanden.');
          NODE_TEST
      - name: Änderungen übernehmen
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lungimport365.js lungimport365.css secure17.js app.js sw.js index.html version.json
          if git diff --cached --quiet; then
            echo 'Keine weiteren Änderungen erforderlich.'
          else
            git commit -m 'PneumoPro 3.6.5: Offline-Lungenbefund aus Foto oder PDF prüfen'
            git push origin HEAD:main
          fi
