              s=one(s,"'rawcharts363.js','doccopy363.js'];","'rawcharts363.js','doccopy363.js','lungimport365.js'];",'App-Module')
              return one(s,"s.src='./'+src+'?v=3.6.4'","s.src='./'+src+'?v=3.6.5'",'Skript-Versionskennung')
