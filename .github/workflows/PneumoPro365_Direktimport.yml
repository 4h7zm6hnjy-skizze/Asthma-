name: PneumoPro 3.6.5 – Foto und PDF direkt als Lungenbefund prüfen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/PneumoPro365_Direktimport.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-365-lungenimport
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub-Repository abrufen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Direkte Foto- und PDF-Erkennung installieren
        shell: bash
        run: |
          python3 - <<'PY_INSTALL'
          from pathlib import Path
          import base64,hashlib,json,sys

          def one(s,old,new,name):
              if s.count(old)!=1: raise RuntimeError(f"{name}: erwartete Quellstelle nicht eindeutig gefunden ({s.count(old)}). Das Update wird abgebrochen.")
              return s.replace(old,new,1)

          def edit(path,transform):
              p=Path(path)
              if not p.is_file(): raise RuntimeError(path+": fehlt. Keine Veröffentlichung.")
              old=p.read_text(encoding="utf-8")
              new=transform(old)
              if old==new: raise RuntimeError(path+": keine sichere Änderung möglich.")
              p.write_text(new,encoding="utf-8")

          version=json.loads(Path('version.json').read_text(encoding='utf-8')).get('version')
          if version=='3.6.5':
              print('3.6.5 bereits installiert; kein doppeltes Update.')
              sys.exit(0)
          if version!='3.6.4': raise RuntimeError('Erwartet Version 3.6.4. Aktueller Stand '+str(version)+'; Abbruch zur Sicherheit.')
          for f in ['lungimport365.js','lungimport365.css']:
              if Path(f).exists(): raise RuntimeError(f+' existiert bereits; keine fremden Dateien überschreiben.')

