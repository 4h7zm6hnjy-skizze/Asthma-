              assert b"dbName='asthma-secure-17'" in content['secure17.js'],'Verschluesselter Speicher darf nicht geaendert werden'
              assert b"Asthma-v17-Vault" in content['secure17.js'],'Backup-Format darf nicht geaendert werden'
              assert b'Bewertung der Daten' in content['index.html']
              assert b'Jetzt neu bewerten' in content['index.html']
              assert b'10 ' in content['bewertung348.js'] or b'N=10' in content['bewertung348.js']
              for name in files:(base/name).write_bytes(content[name])
              print('PneumoPro 3.4.8 installiert: 10er-Vergleich, Ampel und Neuberechnung.')
          PY_UPDATE
      - name: Offline und Datenbestand pruefen und freigeben
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          import json,re,pathlib
          root=pathlib.Path.cwd()
          assert json.loads((root/'version.json').read_text())['version']=='3.4.8'
          text=(root/'sw.js').read_text()
          assets=re.search(r'const ASSETS=\[(.*?)\];',text,re.S)
          assert assets,'Service-Worker-Assetliste fehlt'
          files=re.findall(r"'\./([^']*)'",assets.group(1))
          missing=[s for s in files if s and not (root/s).is_file()]
          assert not missing,'Fehlende Offline-Dateien: '+', '.join(missing)
          assert 'bewertung348.js' in files and 'bewertung348.css' in files
          scripts=(root/'secure17.js').read_text()
          assert "'bewertung348.js'" in scripts
          assert 'asthma-secure-17' in scripts and 'Asthma-v17-Vault' in scripts
          print('Offline-Cache:',len(files),'Dateien; neuer Bereich eingebunden, verschluesselter Tresor unveraendert')
          PY_VERIFY
          node --check bewertung348.js
          node --check secure17.js
          node --check suite15.js
          node --check navigation332.js
