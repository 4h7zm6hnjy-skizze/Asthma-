              for name in files:
                  if name in newfiles:
                      assert not (base/name).exists(),'Neue Datei existiert bereits: '+name
                  else:
                      assert (base/name).is_file() and digest(name)==expected_before[name],'Datei weicht von 3.4.7 ab: '+name
