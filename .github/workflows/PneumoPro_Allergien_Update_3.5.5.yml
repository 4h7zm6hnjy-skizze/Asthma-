name: PneumoPro 3.5.5 - Allergien und Allergietests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pneumopro-allergien-355.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pneumopro-allergien-355-main
  cancel-in-progress: false

jobs:
  allergie-modul:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Aktuelle PneumoPro-Dateien laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Allergiemodul sicher einspielen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUPDATE'
          from pathlib import Path
          import base64, zlib, json, subprocess, sys
          
          VERSION='3.5.5'
          FILES={
           'secure17.js':'b98e20c719582a63b8e8df3d7dfefa45cfe8614c',
           'suite15.js':'d7daac5d5f8135aa40ce1980346011e0a2767057',
           'navigation332.js':'fa86adc8c1a68536e4e8416bf571de4dd96ec1e7',
           'statsplus292.js':'09c8dcea77eb4c6b76e3782930ffc4a6bb95b460',
           'app.js':'1155501c33ac8e676d86809069ae23c1f74e4809',
           'sw.js':'8bd609898a21a0ef772be98093d1357af5857e24',
           'version.json':'a5535f4ad96736fda380778b6dada8a844d5bff5'
          }
          
          # PAYLOAD inserted at packaging stage.
          B64_PAYLOAD=''
          
          def once(text,old,new,label):
              count=text.count(old)
              if count!=1:raise SystemExit('Sicherheitsabbruch: '+label+' nicht eindeutig ('+str(count)+').')
              return text.replace(old,new,1)
          
          source={name:Path(name).read_text(encoding='utf-8') for name in FILES}
          release=json.loads(source['version.json'])
          if release.get('version')==VERSION and Path('allergien355.js').exists():
              print('Version 3.5.5 bereits vorhanden – keine Änderung.')
              raise SystemExit(0)
          if Path('allergien355.js').exists():
              raise SystemExit('Sicherheitsabbruch: Allergiemodul existiert bereits in einer anderen Version. Bitte nicht überschreiben.')
          if release.get('version')!='3.5.4':
              raise SystemExit('Sicherheitsabbruch: Erwartet 3.5.4, gefunden '+str(release.get('version'))+'. Bitte kein älteres Update über neuere Daten schreiben.')
          for path,expected in FILES.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=expected:raise SystemExit('Sicherheitsabbruch: '+path+' wurde seit der Erstellung des Updates geändert. Keine Datei überschrieben.')
          
          changes={}
          
          js=source['secure17.js']
          js=once(js,"'navigation332.js','bewertung348.js'","'navigation332.js','allergien355.js','bewertung348.js'",'Sicherer Modullader')
          js=once(js,"s.src='./'+src+'?v=3.4.8'","s.src='./'+src+'?v=3.5.5'",'Cache-Version des Modulladers')
          changes['secure17.js']=js
          
          js=source['suite15.js']
          js=once(js,"'befunde','labor','therapie'","'befunde','labor','allergien','therapie'",'Seitenfreigabe')
          changes['suite15.js']=js
          
          js=source['navigation332.js']
          js=once(js,"['labor','Labor & Blutwerte','Laborbefunde und Messreihen'],","['labor','Labor & Blutwerte','Laborbefunde und Messreihen'],\n      ['allergien','ALLERGIEN & ALLERGIETESTS','Pollen, Medikamente, Essen, Haut- und Provokationstests'],",'Menüeintrag')
          changes['navigation332.js']=js
          
          js=source['statsplus292.js']
          js=once(js,"['providers','Ärzte & Krankenhäuser – Termine und Dokumente'], ['stairs'","['providers','Ärzte & Krankenhäuser – Termine und Dokumente'], ['allergies','Allergien – Untersuchungsergebnisse'], ['stairs'",'Bericht-Auswahl')
          report_code='''
               // PneumoPro 3.5.5: Allergieakte – nur Befunde im gewählten Berichtzeitraum.
               const allergyRows=suite.filter(x=>x.type==='allergies355').map(x=>x.value).filter(within).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
               const allergySection=node('section','s292-category');allergySection.dataset.s292Kind='allergies';allergySection.dataset.printEnabled=selected.allergies?'true':'false';
               allergySection.append(node('h3','','Allergien und Allergietests'));
               allergySection.append(node('p','s292-note','Erfasst: '+allergyRows.length+' Tests/Reaktionen. Befunde werden nur dokumentiert; ein positiver Prick-/IgE-Test ist allein keine klinische Allergiediagnose.'));
               if(!allergyRows.length)allergySection.append(node('p','s292-empty','Keine Allergiebefunde in diesem Zeitraum.'));
               else{
                 const t=node('table','s292-table'),thead=node('thead'),tr=node('tr');
                 for(const title of ['Datum','Auslöser','Test','Ergebnis','Ärztliche Einordnung','Ampel','Messwert','Praxis / Bemerkung'])tr.append(node('th','',title));thead.append(tr);t.append(thead);
                 const tbody=node('tbody');
                 const resultLabels={negativ:'negativ',positiv:'positiv',grenzwertig:'grenzwertig',reaktion:'Reaktion',ausstehend:'ausstehend',unbekannt:'unbekannt',unklar:'unklar'};
                 const medicalLabels={bestaetigt:'ärztlich bestätigt',ausgeschlossen:'ärztlich ausgeschlossen',verdacht:'Verdacht',ungewiss:'unklar',offen:'offen'};
                 for(const a of allergyRows){
                   const row=node('tr');const rating=window.PNEUMOPRO_ALLERGIEN355?.score(a);
                   const cols=[fmt(a.date),a.allergen||'–',window.PNEUMOPRO_ALLERGIEN355?.methods?.find(m=>m[0]===a.method)?.[1]||a.method||'–',resultLabels[a.result]||a.result||'–',medicalLabels[a.confirmation]||a.confirmation||'–',rating?.label||'nicht bewertet',a.value===null||a.value===undefined?'–':String(a.value)+' '+(a.unit||''),[a.provider,a.symptoms,a.advice,a.notes].filter(Boolean).join(' · ')||'–'];
                   for(const value of cols)row.append(node('td','',value));tbody.append(row);
                 }
                 t.append(tbody);const wrap=node('div','s292-table-wrap');wrap.append(t);allergySection.append(wrap);
               }
               root.append(allergySection);
          '''
          js=once(js,"     const allLung=lung.filter(x=>Array.isArray(x.testRows));",report_code+"     const allLung=lung.filter(x=>Array.isArray(x.testRows));",'Allergie-Berichtsabschnitt')
          changes['statsplus292.js']=js
          
          js=source['app.js']
          js=once(js,"const VERSION = '3.5.4';","const VERSION = '3.5.5';",'App-Version')
          changes['app.js']=js
          
          js=source['sw.js']
          js=once(js,"const VERSION='3.5.4-health-kurzbefehle';","const VERSION='3.5.5-allergien';",'Offline-Version')
          js=once(js,"const ASSETS=[\n './health354.js',","const ASSETS=[\n './allergien355.js', './health354.js',",'Offline-Precache')
          js=once(js,"const important=['/health354.js'","const important=['/allergien355.js','/health354.js'",'Offline-Netzwerkstrategie')
          changes['sw.js']=js
          
          release['version']=VERSION
          release['released']='2026-10-30'
          release['notes']='Neu: Allergien und Allergietests mit Prick-, Epikutan-, IgE-, Medikamenten-, Lebensmittel- und Lungenprovokationstests; dokumentierte Ergebnisse und vorsichtige Ampelbewertung, Originalbefunde, Statistik-Export. Keine automatische Diagnose; Daten lokal verschlüsselt. Vorhandene Daten bleiben erhalten.'
          changes['version.json']=json.dumps(release,ensure_ascii=False,indent=2)+'\n'
          
          # Assert invariants before writing any file.
          addon=zlib.decompress(base64.b64decode(B64_PAYLOAD)).decode('utf-8')
          assert "PNEUMOPRO_ALLERGIEN355" in addon and "SEC.put('suite'" in addon
          assert "'allergien'" in changes['suite15.js']
          assert "allergien355.js" in changes['secure17.js'] and "allergien355.js" in changes['sw.js']
          assert "section.dataset.navPage='allergien'" in addon
          assert "dataset.s292Kind='allergies'" in changes['statsplus292.js']
          assert len(set(changes))==7
          changes['allergien355.js']=addon
          for name,data in changes.items():Path(name).write_text(data,encoding='utf-8')
          print('PneumoPro 3.5.5: '+', '.join(changes)+' aktualisiert.')
          PYUPDATE
      - name: Syntax und Datenintegritaet pruefen
        shell: bash
        run: |
          set -euo pipefail
          node --check allergien355.js
          node --check secure17.js
          node --check suite15.js
          node --check navigation332.js
          node --check statsplus292.js
          node --check app.js
          node --check sw.js
          python3 -m json.tool version.json >/dev/null
          git diff --check
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import json
          assert json.loads(Path('version.json').read_text())['version']=='3.5.5'
          assert "'allergien','ALLERGIEN & ALLERGIETESTS'" in Path('navigation332.js').read_text()
          assert "'allergies','Allergien" in Path('statsplus292.js').read_text()
          assert "'allergien355.js'" in Path('secure17.js').read_text()
          assert "'./allergien355.js'" in Path('sw.js').read_text()
          print('PneumoPro 3.5.5 Integritaetskontrolle bestanden')
          PYVERIFY
      - name: Version 3.5.5 veroeffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allergien355.js secure17.js suite15.js navigation332.js statsplus292.js app.js sw.js version.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen erforderlich"
          else
            git commit -m "PneumoPro 3.5.5: Allergien, Tests, Ampel, Berichte"
            git push origin HEAD:main
          fi
